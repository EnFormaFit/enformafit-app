<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
body{font-family:sans-serif;padding:20px;background:#f4f5f8}
.btn{display:block;width:100%;padding:14px 20px;background:#0DBF6F;color:#fff;border-radius:12px;margin:10px 0;font-size:16px;font-weight:600;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn.on{background:#1A2B5A}
#log{background:#fff;padding:12px;border-radius:10px;margin-top:20px;font-size:12px;font-family:monospace;min-height:150px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h2>Test touch móvil</h2>
<button class="btn" id="b1" onclick="log('CLICK b1');toggle('b1')">Botón 1 — solo onclick</button>
<button class="btn" id="b2" ontouchstart="log('TOUCHSTART b2');toggle('b2')" onclick="log('CLICK b2 (no debería verse en móvil)')">Botón 2 — ontouchstart con preventDefault implícito</button>
<button class="btn" id="b3" ontouchstart="ts(event,'b3')" onclick="tc(event,'b3')">Botón 3 — touchstart+preventDefault stopProp</button>
<div id="log">Toca los botones...\n</div>
<script>
function log(m){const el=document.getElementById('log');el.textContent+=new Date().toISOString().slice(11,22)+' '+m+'\n';el.scrollTop=9999;}
function toggle(id){document.getElementById(id).classList.toggle('on');}
function ts(e,id){e.preventDefault();e.stopPropagation();log('TOUCHSTART '+id+' (preventDefault+stopProp)');toggle(id);}
function tc(e,id){log('CLICK '+id+' (llegó igualmente?)');}
</script>
</body>
</html>
