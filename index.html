<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A2B5A">
<title>EnFormaFit</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--az:#1A2B5A;--az2:#2E6DA4;--az3:#EEF3FA;--az4:#D6E8F5;--vd:#0DBF6F;--vd2:#D4F7E8;--vd3:#7BE8B4;--nr:#FF6B00;--nr2:#FFF0E5;--rj:#FF1A1A;--rj2:#FFE5E5;--rj3:#FF8888;--bg:#F4F5F8;--bor:#E2E6EF;--bor2:#F0F2F8;--t1:#1A2B5A;--t2:#5A6480;--t3:#9199AD;--r:12px;--sh:0 2px 8px rgba(26,43,90,.08);--nh:50px;--nav:64px}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:15px;overflow:hidden}
/* LOGIN */
.lw{position:fixed;inset:0;background:linear-gradient(160deg,var(--az),#0D1F45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.lb{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.llo{text-align:center;margin-bottom:22px}
.llo img{width:165px;height:auto;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto}
.llo small{font-size:12.5px;color:var(--t3);display:block}
.lfi{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.lfi label{font-size:12px;font-weight:600;color:var(--t2)}
.lfi input{border:1.5px solid var(--bor);border-radius:10px;padding:12px 13px;font-size:15px;outline:none;font-family:inherit}
.lfi input:focus{border-color:var(--az2)}
.lbtn{width:100%;padding:13px;background:var(--vd);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.lerr{color:var(--rj);font-size:12.5px;text-align:center;margin-top:9px;display:none}
/* APP SHELL */
.app{display:none;position:fixed;inset:0;flex-direction:column}.app.on{display:flex}
.topbar{background:#fff;border-bottom:1px solid var(--bor);padding:0 15px;height:var(--nh);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:20}
.tbrand{display:flex;align-items:center;gap:6px;overflow:hidden}
/* tlogo replaced by img */
.tsect{font-size:13px;font-weight:600;color:var(--t3);margin-left:4px}
.tav{width:30px;height:30px;border-radius:50%;background:var(--az);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:13px 13px 16px}
/* BOTTOM NAV — igual en móvil y escritorio */
.bnav{flex-shrink:0;height:var(--nav);background:#fff;border-top:1px solid var(--bor);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--t3);border:none;background:none;font-family:inherit;padding:4px 2px;position:relative;transition:color .15s;touch-action:manipulation}
.bni.on{color:var(--az)}
.bni.ctr{background:var(--vd);border-radius:14px;margin:6px 4px;color:#fff;box-shadow:0 3px 10px rgba(13,191,111,.4)}
.bni.ctr.on{background:#09a85e}
.bni svg{width:23px;height:23px}
.bni span{font-size:10px;font-weight:600}
.bni-dot{position:absolute;top:5px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--rj);border:1.5px solid #fff}
@media(min-width:768px){
  .content{padding:20px;max-width:680px;margin:0 auto;padding-bottom:24px}
  .bnav{max-width:680px;margin:0 auto;width:100%}
}
/* CARDS */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--bor);box-shadow:var(--sh);margin-bottom:11px;overflow:hidden}
.ch{padding:12px 14px;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;gap:8px}.ch h2{font-size:14px;font-weight:700}
.cb{padding:14px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bvd{background:var(--vd2);color:#07854D}.baz{background:var(--az3);color:var(--az2)}.bnr{background:var(--nr2);color:#CC5500}.brj{background:var(--rj2);color:var(--rj)}
/* BANNERS */
.rbann{border-radius:var(--r);padding:13px 15px;color:#fff;margin-bottom:11px;cursor:pointer;position:relative;overflow:hidden}
.rbann.urg{background:linear-gradient(135deg,var(--nr),#E65A00)}.rbann.prx{background:linear-gradient(135deg,var(--az),var(--az2))}
.rbann::after{content:"📅";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:34px;opacity:.13}
.rb-tag{font-size:10px;font-weight:700;letter-spacing:.7px;opacity:.8;margin-bottom:3px}
.rb-fecha{font-size:18px;font-weight:800;margin-bottom:2px}.rb-sub{font-size:12px;opacity:.82;margin-bottom:7px}
.rb-pill{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.hoyt{background:linear-gradient(135deg,var(--az),var(--az2));border-radius:var(--r);padding:13px 15px;color:#fff;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:0 4px 16px rgba(26,43,90,.2)}
.ht-info small{font-size:10px;opacity:.7;font-weight:700;text-transform:uppercase;display:block;margin-bottom:2px}
.ht-info b{font-size:16px;font-weight:800;display:block}.ht-info span{font-size:12px;opacity:.75;display:block;margin-top:1px}
/* STATS GRID */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
@media(min-width:480px){.sg{grid-template-columns:repeat(4,1fr)}}
.sc{background:#fff;border-radius:var(--r);border:1px solid var(--bor);padding:12px;text-align:center;box-shadow:var(--sh)}
.sv{font-size:22px;font-weight:800;line-height:1;margin-bottom:2px}.sl{font-size:10.5px;color:var(--t3);font-weight:500}
/* PASOS */
.pasosc{background:linear-gradient(135deg,#27AE60,#2ECC71);border-radius:var(--r);padding:13px 15px;color:#fff;margin-bottom:11px;box-shadow:0 4px 14px rgba(39,174,96,.25)}
.pasos-n{font-size:28px;font-weight:800;line-height:1}
.pasos-bar{background:rgba(255,255,255,.25);border-radius:5px;height:7px;margin-top:8px;overflow:hidden}
.pasos-fill{height:100%;background:#fff;border-radius:5px;transition:width .8s}
.rachac{background:linear-gradient(135deg,#E67E22,#F39C12);border-radius:var(--r);padding:12px 15px;color:#fff;display:flex;align-items:center;gap:12px;margin-bottom:11px;box-shadow:0 4px 14px rgba(230,126,34,.25)}
/* PROGRESS BAR */
.pb{height:6px;background:var(--bor);border-radius:3px;overflow:hidden;margin-top:4px}
.pf{height:100%;border-radius:3px;transition:width .6s}
/* SEMANAS */
.semp{display:flex;gap:3px;flex-wrap:wrap;margin:8px 0}
.sb{width:29px;height:29px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.sbd{background:var(--vd);color:#fff}.sbr{background:var(--az2);color:#fff}.sbc{background:var(--nr);color:#fff}.sbt{background:var(--bg);color:var(--t3);border:1.5px solid var(--bor)}
/* ENTRENO */
.day-sticky{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 6px;margin:-13px -13px 10px;padding-left:13px;padding-right:13px;border-bottom:1px solid var(--bor2)}
@media(min-width:768px){.day-sticky{margin:-20px -20px 12px;padding-left:20px;padding-right:20px}}
.day-sel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.day-sel::-webkit-scrollbar{display:none}
.day-b{flex-shrink:0;padding:7px 12px;border-radius:20px;border:1.5px solid var(--bor);background:#fff;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;text-align:center;line-height:1.3;transition:all .15s;touch-action:manipulation;-webkit-user-select:none}
.day-b *{pointer-events:none}
.day-b *,.opt small,.nd small,.bni small,.bni span{pointer-events:none}
.day-b.on{background:var(--az);border-color:var(--az);color:#fff}
.day-b.today{border-color:var(--vd);color:#07854D}.day-b.today.on{background:var(--vd);border-color:var(--vd);color:#fff}
.day-b.rest-day{color:var(--t3);font-style:italic}
/* EJERCICIOS */
.ejcard{background:#fff;border-radius:10px;border:1px solid var(--bor);margin-bottom:10px;overflow:hidden}
.ejhead{padding:12px 14px;display:flex;gap:10px;border-bottom:1px solid var(--bor2)}
.ejnum{width:26px;height:26px;border-radius:50%;background:var(--az);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.ejnom{font-size:15.5px;font-weight:700;margin-bottom:2px}.ejmeta{font-size:13.5px;color:var(--t3);font-weight:500}
.ejacl{font-size:12.5px;color:var(--t2);font-style:italic;margin-top:4px;line-height:1.4}
.ejyt{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:12px;color:var(--rj);font-weight:700;text-decoration:none;background:var(--rj2);padding:4px 10px;border-radius:20px;border:1px solid var(--rj3)}
.grabar-pill{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;font-weight:700;background:#FFF0E5;color:#CC5500;border:1px solid #FFD4B0;padding:5px 11px;border-radius:20px}
.serwrap{padding:11px 14px}
.serhd{display:grid;grid-template-columns:20px 56px 1fr 56px 34px;gap:6px;margin-bottom:8px;font-size:10.5px;color:var(--t3);font-weight:700;text-transform:uppercase;text-align:center}
.serrow{display:grid;grid-template-columns:20px 56px 1fr 56px 34px;gap:6px;align-items:center;margin-bottom:8px}
.sern{font-size:13px;font-weight:700;color:var(--t3);text-align:center}.serant{font-size:11.5px;color:var(--t3);text-align:center;line-height:1.2}
.sinp{border:1.5px solid var(--bor);border-radius:8px;padding:9px 4px;font-size:16px;font-weight:700;text-align:center;outline:none;font-family:inherit;width:100%;transition:border .15s;-webkit-appearance:none}
.sinp:focus{border-color:var(--az2)}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--bor);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;flex-shrink:0;touch-action:manipulation;font-family:inherit;margin:0 auto}
.ck.on{background:var(--vd);border-color:var(--vd)}
.ej-collapsed{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-top:1px solid var(--bor2)}
.ej-col-info{font-size:12.5px;color:var(--t2)}
.ej-edit-btn{font-size:12px;color:var(--az2);background:var(--az3);border:none;cursor:pointer;font-family:inherit;font-weight:600;padding:4px 9px;border-radius:6px;touch-action:manipulation}
/* TIMER */
.timer{display:none;position:fixed;bottom:calc(var(--nav)+10px);left:50%;transform:translateX(-50%);background:rgba(26,43,90,.96);backdrop-filter:blur(10px);color:#fff;border-radius:22px;padding:10px 20px;z-index:50;box-shadow:0 8px 28px rgba(0,0,0,.35);align-items:center;gap:12px}
.timer.show{display:flex}.timer-n{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
/* NUTRICIÓN */
.sticky-tabs{position:sticky;top:0;z-index:10;background:var(--bg);padding:0 13px;border-bottom:2px solid var(--bor);margin-left:-13px;margin-right:-13px;margin-top:0}
@media(min-width:768px){.sticky-tabs{padding:0 20px;margin-left:-20px;margin-right:-20px}}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;flex-shrink:0;transition:all .15s;touch-action:manipulation;font-family:inherit;border:none;background:none}
.tab.on{color:var(--az);border-bottom:2.5px solid var(--az);font-weight:700;margin-bottom:-2px}
.nut-day-sticky{position:sticky;top:40px;z-index:9;background:var(--bg);padding:7px 13px 5px;margin-left:-13px;margin-right:-13px;border-bottom:1px solid var(--bor2)}
@media(min-width:768px){.nut-day-sticky{padding-left:20px;padding-right:20px;margin-left:-20px;margin-right:-20px;top:40px}}
.nut-days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.nut-days::-webkit-scrollbar{display:none}
.nd{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1.5px solid var(--bor);background:#fff;font-size:12.5px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s;touch-action:manipulation}
.nd.on{background:var(--az);border-color:var(--az);color:#fff}
/* MENÚ PLEGADO */
.meal-collapsed{border:1px solid var(--bor);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff}
.meal-col-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;touch-action:manipulation}
.meal-col-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.meal-col-sum{font-size:12px;color:var(--t3);margin-top:2px}
.meal-col-kcal{font-size:13px;font-weight:700;color:var(--az2)}
.meal-col-body{padding:0 14px 12px;border-top:1px solid var(--bor2);display:none}
.meal-col-body.open{display:block}
.meal-alim{font-size:13px;color:var(--t2);padding:5px 0;border-bottom:1px solid var(--bor2);display:flex;justify-content:space-between}
.meal-alim:last-child{border-bottom:none}
/* MENÚ EDITOR */
.meal-sec{border-bottom:1px solid var(--bor2);padding-bottom:14px;margin-bottom:14px}
.meal-sec:last-child{border-bottom:none;margin-bottom:0}
.meal-title{font-size:15px;font-weight:800;margin-bottom:3px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-sum{font-size:12px;color:var(--t3);margin-bottom:8px;font-weight:500}
.cat-lbl{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.opts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.opt{padding:7px 11px;border-radius:20px;border:1.5px solid var(--bor);background:#fff;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s;touch-action:manipulation;line-height:1.3;-webkit-user-select:none;user-select:none;display:inline-block}
.opt small{display:block;font-size:10.5px;opacity:.65;margin-top:1px;pointer-events:none}
.opt.on{border-color:var(--vd);background:var(--vd2);color:#07854D;font-weight:600}
.opt *{pointer-events:none}
.fat-alert{background:var(--nr2);color:#CC5500;border:1px solid #FFD4B0;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:8px;line-height:1.4}
.missing-alert{background:var(--rj2);color:var(--rj);border:1px solid var(--rj3);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:8px;display:none}
/* MACROS */
.macrog{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
.maci{background:var(--bg);border-radius:9px;padding:11px;text-align:center;border:1px solid var(--bor)}
.macv{font-size:20px;font-weight:800}.macl{font-size:10.5px;color:var(--t3);margin-top:2px;font-weight:500}
/* PROGRESO */
.pesob{width:100%;text-align:center;font-size:44px;font-weight:800;border:none;outline:none;background:transparent;color:var(--az);font-family:inherit;padding:10px 0}
.fscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.fscroll::-webkit-scrollbar{display:none}
.fgrp{flex-shrink:0;width:170px}
.fgrp-t{font-size:11px;font-weight:700;text-align:center;padding:5px 8px;border-radius:7px 7px 0 0;margin-bottom:4px}
.ft-az{background:var(--az);color:#fff}.ft-vd{background:var(--vd);color:#fff}.ft-gr{background:var(--az3);color:var(--az2)}
.fslot{background:var(--bg);border:1.5px dashed var(--bor);border-radius:8px;width:100%;aspect-ratio:3/5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;margin-bottom:5px;transition:all .15s;overflow:hidden;position:relative}
.fslot.has{border-style:solid;border-color:var(--vd3)}.fslot.locked{opacity:.35;cursor:not-allowed;pointer-events:none}
.fslot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.fslot-lbl{font-size:10.5px;color:var(--t3);font-weight:600;text-align:center;z-index:1;padding:4px}
/* LOGROS */
.logro{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--bor2)}.logro:last-child{border-bottom:none}
.logro.locked{opacity:.3}.logro-ico{font-size:24px;flex-shrink:0}
.logro-nom{font-size:14px;font-weight:600}.logro-desc{font-size:12px;color:var(--t3);margin-top:1px;line-height:1.4}
/* REVISIÓN */
.rfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.rfb{border:2px dashed var(--bor);border-radius:10px;aspect-ratio:3/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;background:var(--bg);transition:all .15s;overflow:hidden;position:relative;touch-action:manipulation}
.rfb.done{border-color:var(--vd);border-style:solid;background:var(--vd2)}
.rfb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rfb-lbl{font-size:10.5px;color:var(--t3);font-weight:600;z-index:1;text-align:center;padding:4px}.rfb.done .rfb-lbl{color:#07854D}
/* INPUTS */
.medin{width:100%;border:1.5px solid var(--bor);border-radius:9px;padding:11px 12px;font-size:15px;outline:none;font-family:inherit;transition:border .15s;-webkit-appearance:none}
.medin:focus{border-color:var(--az2)}
.preqa{width:100%;border:1.5px solid var(--bor);border-radius:9px;padding:11px 12px;font-size:14px;outline:none;font-family:inherit;resize:none;transition:border .15s;min-height:72px}
.preqa:focus{border-color:var(--az2)}
/* CHECK-IN */
.ci-toggle{width:100%;text-align:left;background:#fff;border:1.5px solid var(--bor);border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center;transition:all .15s;touch-action:manipulation}
.ci-toggle.open{border-color:var(--az2);border-radius:10px 10px 0 0}
.ci-body{border:1.5px solid var(--az2);border-top:none;border-radius:0 0 10px 10px;padding:14px;background:#fff;display:none}
.ci-body.open{display:block}
.ci-q{font-size:13.5px;font-weight:600;margin-bottom:8px;color:var(--t1)}
.dayrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dday{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bor);background:#fff;font-size:12.5px;font-weight:600;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;touch-action:manipulation;-webkit-user-select:none}
.dday.on{background:var(--vd);border-color:var(--vd);color:#fff}
.stars{display:flex;gap:8px;margin-bottom:12px}.star{font-size:26px;cursor:pointer;opacity:.25;transition:opacity .15s;touch-action:manipulation;-webkit-user-select:none}.star.on{opacity:1}
/* ENVIADO */
.enviado-state{background:var(--vd2);border:1px solid var(--vd3);border-radius:10px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.es-txt b{font-size:14px;color:#07854D;display:block}.es-txt small{font-size:12px;color:#09a85e}
/* PERFIL */
.pav{width:62px;height:62px;border-radius:50%;background:var(--az);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 9px}
.trainer-c{display:flex;align-items:center;gap:11px;padding:13px;background:var(--az3);border-radius:10px;margin-bottom:11px;border:1px solid var(--az4)}
.trainer-av{width:42px;height:42px;border-radius:50%;background:var(--az);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
/* FAQ */
.faq-item{border-bottom:1px solid var(--bor2)}
.faq-q{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:13.5px;font-weight:600;gap:8px;touch-action:manipulation;border:none;background:none;width:100%;text-align:left;font-family:inherit;color:var(--t1)}
.faq-a{padding:0 14px 12px;font-size:13px;color:var(--t2);line-height:1.6;display:none}.faq-a.open{display:block}
/* ALERTS */
.alert{padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:11px;line-height:1.5}
.avd{background:var(--vd2);color:#07854D;border:1px solid var(--vd3)}.aaz{background:var(--az3);color:var(--az2);border:1px solid var(--az4)}.aam{background:#FEF9E7;color:#8B6914;border:1px solid #F9E79F}
/* BUTTONS */
.btn{padding:10px 17px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;transition:all .15s;touch-action:manipulation;-webkit-user-select:none}
.btnp{background:var(--vd);color:#fff}.btno{background:#fff;color:var(--az2);border:1.5px solid var(--bor)}.btngr{background:var(--bg);color:var(--t2);border:1.5px solid var(--bor)}
.btnf{width:100%;padding:13px;margin-bottom:11px}.btns{padding:6px 13px;font-size:13px}
/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;align-items:flex-end;justify-content:center}.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px}
.modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
.modal-opt{padding:12px 14px;border-radius:10px;border:1.5px solid var(--bor);margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s;touch-action:manipulation}.modal-opt:active{background:var(--az3)}
/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav)+12px);left:50%;transform:translateX(-50%) translateY(14px);background:var(--az);color:#fff;padding:9px 18px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:200;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.22);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.vd{background:var(--vd)}.toast.rj{background:var(--rj)}
/* MISC */
.compra-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bor2);font-size:14px;align-items:center}.compra-item:last-child{border-bottom:none}
svg.cht{width:100%;height:125px;overflow:visible}
input[type=file]{display:none}</style>

function buildEntHTML(di){
  const d=DIAS[di];

  const dayBtns=DIAS.map((dd,i)=>`<button class="day-b${i===di?' on':''}${i===todayIdx?' today':''}${dd.rest?' rest-day':''}" onclick="curDay=${i};render()">${dd.nom}<br><small style="font-size:9.5px;opacity:.65">${dd.tipo}</small></button>`).join('');

    </div></div>`;
  }else{
    const grabIdxs=ST.u.tipo==='uno'?getGrabarIdxs(di):[];
    body=d.ejercicios.map((ej,ei)=>renderEj(ej,ei,di,grabIdxs)).join('');
    body+=`<button class="btn btnp btnf" onclick="guardarDia(${di})">Guardar entrenamiento ✓</button>`;
  }
  return`<div class="day-sticky"><div class="day-sel">${dayBtns}</div></div>${body}`;
}

function getGrabarIdxs(diaIdx){
  // 1-2 ejercicios a grabar por sesión, rotan cada 2 semanas usando semana como seed
  const s=ST.u.semana;
  const ejs=DIAS[diaIdx]?.ejercicios||[];
  if(!ejs.length)return[];
  // Seed: semana//2 para que cambie cada 2 semanas
  const seed=Math.floor(s/2);
  // Elegir índices basados en seed y día
  const n=Math.min(2,ejs.length);
  const idxs=[];
  for(let i=0;i<n;i++){
    const idx=(seed*3+diaIdx*7+i*4)%ejs.length;
    if(!idxs.includes(idx))idxs.push(idx);
  }
  return idxs;
}

function renderEntDia(){
  const ct=document.getElementById('ct');
  if(ct)ct.innerHTML=buildEntHTML(curDay);
}

function renderEj(ej,ei,di,grabIdxs){
  const key=`${di}_${ei}`;
  if(!ST.ejStates[key])ST.ejStates[key]={collapsed:false,series:Array.from({length:ej.sets},()=>({kg:'',repsH:'',done:false})),rest:ej.rest||120};
  const st=ST.ejStates[key];
  const esGrabar=(grabIdxs||[]).includes(ei);
  if(st.collapsed){
    const done=st.series.filter(s=>s.done).length;
    const kgs=st.series.map(s=>s.kg||'BW').join('/');
    return`<div class="ejcard">
      <div class="ejhead" onclick="ST.ejStates['${key}'].collapsed=false;renderEntDia()">
        <div class="ejnum">${ei+1}</div>
        <div style="flex:1">
          <div class="ejnom">${ej.nom}${esGrabar?' 🎥':''}</div>
          <div class="ejmeta">${ej.sets}×${ej.reps} · RIR ${ej.rir||0}</div>
        </div>
      </div>
      <div class="ej-collapsed">
        <div class="ej-col-info">✅ ${done}/${ej.sets} series · ${kgs}kg</div>
        <button class="ej-edit-btn" onclick="ST.ejStates['${key}'].collapsed=false;renderEntDia()">Editar</button>
      </div>
    </div>`;
  }
  const ytBtn=ej.url?`<a href="${ej.url}" target="_blank" class="ejyt">▶ Ver vídeo</a>`:'';
  const aclTxt=ej.acl?`<div class="ejacl">${ej.acl}</div>`:'';
  const bwNote=ej.bw?'<div style="font-size:11.5px;color:var(--t3);margin-bottom:6px">💡 Deja vacío si es con peso corporal</div>':'';
  const grabarBadge=esGrabar?`<div class="grabar-pill">🎥 Graba este ejercicio y envíaselo a tu entrenador</div>`:'';
  let sers=`<div class="serwrap">${bwNote}<div class="serhd"><span>#</span><span>Ant.</span><span>Kg</span><span>Reps</span><span>✓</span></div>`;
  st.series.forEach((s,si)=>{
    sers+=`<div class="serrow">
      <div class="sern">${si+1}</div>
      <div class="serant">${s.done?s.kg||'BW':'—'}</div>
      <input class="sinp" type="number" inputmode="decimal" placeholder="kg" value="${s.kg}" onchange="ST.ejStates['${key}'].series[${si}].kg=this.value" style="min-width:0">
      <input class="sinp" type="number" inputmode="numeric" placeholder="${ej.reps}" value="${s.repsH}" onchange="ST.ejStates['${key}'].series[${si}].repsH=this.value" style="min-width:0">
      <button class="ck ${s.done?'on':''}" onclick="toggleSer('${key}',${si})">${s.done?'✓':''}</button>
    </div>`;
  });
  sers+=`</div>`;
  return`<div class="ejcard">
    <div class="ejhead">
      <div class="ejnum">${ei+1}</div>
      <div style="flex:1">
        <div class="ejnom">${ej.nom}</div>
        <div class="ejmeta">${ej.sets} series · ${ej.reps} reps · RIR ${ej.rir||0}</div>
        ${aclTxt}${ytBtn}${grabarBadge}
      </div>
    </div>
    ${sers}
  </div>`;
}

function toggleSer(key,si){
  const s=ST.ejStates[key].series[si];s.done=!s.done;
  if(s.done)startTimer(ST.ejStates[key].rest||120);
  renderEntDia();
}
function guardarDia(di){
  if(!ST.ejStates)ST.ejStates={};
  // Plegar TODOS los ejercicios del día, estén abiertos o no
  DIAS[di].ejercicios.forEach((ej,ei)=>{
    const key=`${di}_${ei}`;
    if(!ST.ejStates[key]){
      // Crear estado con collapsed=true directamente
      ST.ejStates[key]={
        collapsed:true,
        series:Array.from({length:ej.sets||3},()=>({kg:'',repsH:'',done:false})),
        rest:ej.rest||120
      };
    } else {
      ST.ejStates[key].collapsed=true;
    }
  });
  save();
  render();
  toast('Entrenamiento guardado ✓','vd');
}
function startTimer(sec){
  TIMSEC=sec;
  const d=document.getElementById('timDiv');d.classList.add('show');
  clearInterval(TIMID);
  TIMID=setInterval(()=>{
    TIMSEC--;
    document.getElementById('timN').textContent=Math.floor(TIMSEC/60)+':'+(TIMSEC%60).toString().padStart(2,'0');
    if(TIMSEC<=0){clearInterval(TIMID);d.classList.remove('show');toast('¡Siguiente serie!','vd');}
  },1000);
  document.getElementById('timN').textContent=Math.floor(sec/60)+':'+(sec%60).toString().padStart(2,'0');
}
function stopTimer(){clearInterval(TIMID);document.getElementById('timDiv').classList.remove('show');}

function renderMenuEditor(di,isSuperavit){
  _NIT=[];_NIT_VERSION++;

    // Proteína grasa

    (md.proteinas_grasas||[]).forEach(it=>{
      const on=ms.prot&&ms.prot.nom===it.nom&&protType==='grasa';

      out+=`<button class="opt ${on?'on':''}" onclick="nitP(${di},'${meal}','grasa',${idx})">${it.nom}</button>`;
    });
    out+=`</div>`;

    if(isFat)out+=`<div class="fat-alert">⚠️ Esta proteína ya aporta su propia grasa — no añadas grasa adicional en esta comida.</div>`;

    // Hidrato
    out+=`<div class="cat-lbl">Hidrato</div><div class="opts">`;
    (md.hidratos||[]).forEach(it=>{
      const on=ms.hidrat&&ms.hidrat.nom===it.nom;
      const idx=(_NIT.push(it)-1);
      out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','hidrat',${idx})">${it.nom}</button>`;
    });
    out+=`</div>`;

    // Verdura (comida y cena)
    if(md.verduras){
      out+=`<div class="cat-lbl">Verdura</div><div class="opts">`;

        const on=ms.verd&&ms.verd.nom===it.nom;
        const idx=(_NIT.push(it)-1);
        out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','verd',${idx})">${it.nom}</button>`;
      });
      out+=`</div>`;
    }

    // Fruta (desayuno + snack)
    if(md.frutas){
      out+=`<div class="cat-lbl">Fruta</div><div class="opts">`;
      md.frutas.forEach(it=>{
        const on=ms.fruta&&ms.fruta.nom===it.nom;
        const idx=(_NIT.push(it)-1);
        out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','fruta',${idx})">${it.nom}</button>`;
      });
      out+=`</div>`;
    }

    // Grasa (solo si proteína magra)
    if(showFat&&md.grasas){
      out+=`<div class="cat-lbl">Grasa</div><div class="opts">`;
      md.grasas.forEach(it=>{
        const on=ms.fat&&ms.fat.nom===it.nom;
        const idx=(_NIT.push(it)-1);
        out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','fat',${idx})">${it.nom}</button>`;
      });
      out+=`</div>`;
    }

    // Grasa superávit snack
    if(meal==='snack'&&isSuperavit&&md.grasas_superavit){
      out+=`<div class="cat-lbl" style="color:var(--nr)">Grasa extra (superávit calórico)</div><div class="opts">`;
      md.grasas_superavit.forEach(it=>{
        const on=ms.fat&&ms.fat.nom===it.nom;
        const idx=(_NIT.push(it)-1);
        out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','fat',${idx})">${it.nom}</button>`;
      });
      out+=`</div>`;
    }
    out+=`</div>`;
  });

  // Update debug counter
  out+=`<div id="missing-alert" class="missing-alert">⚠️ Falta seleccionar algún alimento en una o más comidas</div>`;
  out+=`<div style="display:flex;gap:8px;margin-bottom:12px">

  </div>`;
  out+=`<div class="alert aaz">💧 Recuerda beber al menos 2L de agua hoy</div>`;
  return out;
}

  if(!it){document.getElementById('ct').innerHTML=renderNutricion();return;}
  selItem(di,meal,cat,it);
}
function selProt(di,meal,nom,tipo,item){
  if(!ST.menu[di])ST.menu[di]={};
  if(!ST.menu[di][meal])ST.menu[di][meal]={};
  const cur=ST.menu[di][meal];
  if(cur.prot&&cur.prot.nom===nom&&cur.protType===tipo){delete cur.prot;delete cur.protType;}
  else{cur.prot=item;cur.protType=tipo;if(tipo==='grasa')delete cur.fat;}
  save();document.getElementById('ct').innerHTML=renderNutricion();initTouchDelegation();
}
function selItem(di,meal,cat,item){
  if(!ST.menu[di])ST.menu[di]={};
  if(!ST.menu[di][meal])ST.menu[di][meal]={};
  const cur=ST.menu[di][meal];
  if(cur[cat]&&cur[cat].nom===item.nom)delete cur[cat];else cur[cat]=item;
  save();document.getElementById('ct').innerHTML=renderNutricion();initTouchDelegation();
}

function guardarMenu(di){
  // Verificar que todas las comidas tienen al menos proteína e hidrato
  const MEALS=['desayuno','comida','cena','snack'];
  const m=ST.menu[di]||{};
  const faltantes=[];
  MEALS.forEach(meal=>{
    const ms=m[meal]||{};
    const md=MENU[meal];
    const MEAL_NAMES={desayuno:'Desayuno',comida:'Comida',cena:'Cena',snack:'Snack'};
    const mn=MEAL_NAMES[meal];
    if(!ms.prot)faltantes.push(mn+': falta proteína');
    if(!ms.hidrat)faltantes.push(mn+': falta hidrato');
    if(ms.prot&&ms.protType==='magra'&&md.grasas&&md.grasas.length>0&&!ms.fat){
      faltantes.push(mn+': falta grasa (elegiste proteína magra)');
    }
    if((meal==='comida'||meal==='cena')&&md.verduras&&md.verduras.length>0&&!ms.verd){
      faltantes.push(mn+': falta verdura');
    }

  });
  if(faltantes.length){
    const al=document.getElementById('missing-alert');
    if(al){al.style.display='block';al.textContent='⚠️ Faltan: '+faltantes.map(f=>f.charAt(0).toUpperCase()+f.slice(1)).join(' · ');}
    toast('Revisa lo que falta ↑','rj');
    document.getElementById('ct').scrollTop=document.getElementById('missing-alert')?.offsetTop||0;
    return;
  }
  ST.menuGuardado[di]=JSON.parse(JSON.stringify(m));
  ST.nutEditing=false;
  save();
  document.getElementById('ct').innerHTML=renderNutricion();
  document.getElementById('ct').scrollTop=0;
  toast('Menú guardado ✓','vd');
}

function generateMenuPDF(){
  // Verificar semana completa
  const DNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const MEALS=['desayuno','comida','cena','snack'];
  const MEAL_NOM={desayuno:'Desayuno',comida:'Comida',cena:'Cena',snack:'Snack'};
  const incomplete=DNAMES.filter((_,i)=>!ST.menuGuardado[i]||Object.keys(ST.menuGuardado[i]).length<4);
  if(incomplete.length>0){toast('Completa y guarda todos los días primero','rj');return;}
  // Construir contenido texto del PDF
  let txt='PLAN DE NUTRICIÓN\n';
  txt+='EnFormaFit · '+ST.u.nom+'\n';
  txt+='Generado el '+new Date().toLocaleDateString('es')+'\n\n';
  DNAMES.forEach((dia,di)=>{
    txt+='═══ '+dia.toUpperCase()+' ═══\n';
    const mg=ST.menuGuardado[di]||{};
    MEALS.forEach(meal=>{
      const ms=mg[meal]||{};
      txt+='  '+MEAL_NOM[meal]+':\n';
      ['prot','hidrat','fat','fruta','verd'].forEach(cat=>{
        if(ms[cat]){
          const it=ms[cat];
          const cant=it.cantidad&&it.u?(' — '+Math.round(it.cantidad)+it.u):'';
          txt+='    · '+it.nom+cant+'\n';
        }
      });
    });
    txt+='\n';
  });
  // Descargar como archivo texto (funciona sin librería externa)
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='plan_nutricion_'+ST.u.nom.replace(/\s+/g,'_')+'.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Plan descargado ✓','vd');
}

let _copyFrom=-1,_copyTargets=[];
function copiarDia(di){
  _copyFrom=di;_copyTargets=[];
  const DNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const opts=DNAMES.map((d,i)=>i===di?'':`
    <div class="modal-opt" id="copt${i}" onclick="toggleCopyTarget(${i})" style="display:flex;align-items:center;justify-content:space-between">
      <span>${d}</span><span id="coptck${i}" style="font-size:18px;color:var(--vd)"></span>
    </div>`).join('');
  openModal('Copiar menú de '+DNAMES[di]+' a...',opts+`
    <button class="btn btnp btnf" style="margin-top:8px" onclick="confirmarCopia()">Copiar a días seleccionados ✓</button>`);
}
function toggleCopyTarget(i){
  const idx=_copyTargets.indexOf(i);
  if(idx>=0)_copyTargets.splice(idx,1);else _copyTargets.push(i);
  document.querySelectorAll('[id^="coptck"]').forEach(el=>el.textContent='');
  _copyTargets.forEach(t=>{const el=document.getElementById('coptck'+t);if(el)el.textContent='✓';});
  document.querySelectorAll('[id^="copt"]').forEach(el=>el.style.background='');
  _copyTargets.forEach(t=>{const el=document.getElementById('copt'+t);if(el)el.style.background='var(--vd2)';});
}
function confirmarCopia(){
  if(!_copyTargets.length){toast('Selecciona al menos un día','rj');return;}
  const DNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  _copyTargets.forEach(to=>{
    ST.menu[to]=JSON.parse(JSON.stringify(ST.menu[_copyFrom]||{}));
    ST.menuGuardado[to]=JSON.parse(JSON.stringify(ST.menuGuardado[_copyFrom]||{}));
  });
  save();closeModal();
  toast('Copiado a '+_copyTargets.map(t=>DNAMES[t]).join(', '),'vd');
}

function renderLista(){
  const totals={};
  const verdRaciones={};
  if(!ST.listaCheck)ST.listaCheck={};
  // Solo usar menuGuardado para evitar duplicar con menu en edición
  const src2=ST.menuGuardado;
  Object.values(src2).forEach(dia=>{
    if(typeof dia!=='object')return;
    Object.values(dia).forEach(meal=>{
      if(typeof meal!=='object')return;
      if(meal.verd){
        const nom=meal.verd.nom;
        verdRaciones[nom]=(verdRaciones[nom]||0)+1;
      }
      ['prot','hidrat','fat','fruta'].forEach(cat=>{
        if(meal[cat]){
          const it=meal[cat];
          if(!totals[it.nom])totals[it.nom]={nom:it.nom,u:it.u,cantidad:0};
          totals[it.nom].cantidad+=it.cantidad||0;
        }
      });
    });
  });
  // Combinar items normales + verduras por raciones
  const verdItems=Object.entries(verdRaciones).sort((a,b)=>a[0].localeCompare(b[0])).map(([nom,r])=>({nom,u:'rac',cantidad:r,esVerd:true}));
  const items=[...Object.values(totals).sort((a,b)=>a.nom.localeCompare(b.nom)),...verdItems];
  if(!items.length)return`<div class="card"><div class="cb" style="text-align:center;padding:24px;color:var(--t3)">Configura tu menú primero para ver la lista de compra</div></div>`;
  return`<div class="card"><div class="ch"><h2>🛒 Lista de la compra (7 días)</h2><button class="btn btns btngr" onclick="ST.listaCheck={};save();document.getElementById('ct').innerHTML=renderNutricion()">Reiniciar</button></div><div class="cb">${items.map(it=>{
    const checked=ST.listaCheck[it.nom]||false;
    const cantStr=it.esVerd?it.cantidad+' ración'+(it.cantidad>1?'es':''):Math.round(it.cantidad)+it.u;
    return`<div class="compra-item" style="opacity:${checked?.4:1}">
      <span style="text-decoration:${checked?'line-through':'none'};color:${checked?'var(--t3)':'inherit'}">${it.nom}</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-weight:700;color:${checked?'var(--t3)':'var(--az)'}">${cantStr}</span>
        <button onclick="ST.listaCheck['${it.nom}']=!ST.listaCheck['${it.nom}'];save();document.getElementById('ct').innerHTML=renderNutricion()" style="width:26px;height:26px;border-radius:6px;border:2px solid ${checked?'var(--vd)':'var(--bor)'};background:${checked?'var(--vd)':'#fff'};cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;touch-action:manipulation">${checked?'✓':''}</button>
      </div>
    </div>`;
  }).join('')}</div></div>`;
}

function renderProgreso(){

  const W=320,H=140,PL=38,PR=12,PT=16,PB=28;

  const mn=Math.min(...vals,ST.objPeso)-1;
  const mx=Math.max(...vals)+1;
  const xOf=i=>(PL+(i/(vals.length-1||1))*(W-PL-PR)).toFixed(1);
  const yOf=v=>(PT+(1-(v-mn)/(mx-mn||1))*(H-PT-PB)).toFixed(1);

  // ── FOTOS COMPARADAS ──
  let fotosH=`<div class="fscroll">`;

      </div>`;
    }).join('');
  }

  // ── LOGROS ──
  const LA=[

    {ico:'📸',nom:'Primera revisión',desc:'Enviaste tu primera revisión',done:ST.rev.done},
    {ico:'🔥',nom:'Racha de 7 días',desc:'7 días seguidos en verde',done:ST.racha>=7},
    {ico:'🎯',nom:'Semana perfecta',desc:'Entrenos + nutrición + pasos al 100%',done:false},
    {ico:'💪',nom:'Bloque completado',desc:'12 semanas finalizadas',done:semana>=12},

  return`

    ${ST.pesosOpen?`<div style="margin-top:8px">${[...pesos].reverse().map(p=>{const d=p.f.split('-');return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bor2);font-size:13px"><span style="color:var(--t2)">'+d[2]+'/'+d[1]+'/'+d[0].slice(2)+'</span><span style="font-weight:700;color:var(--az)">'+p.v+' kg</span></div>';}).join('')}</div>`:''}

function addPeso(v){const n=parseFloat(v);if(isNaN(n)||n<30||n>300)return;const today=new Date().toISOString().split('T')[0];const last=ST.pesos[ST.pesos.length-1];if(last.f===today)last.v=n;else ST.pesos.push({f:today,v:n});save();toast('Peso guardado ✓','vd');}
function addPesoConFecha(){
  const v=document.getElementById('pesoVal').value;
  const f=document.getElementById('pesoFecha').value;
  const n=parseFloat(v);
  if(isNaN(n)||n<30||n>300){toast('Introduce un peso válido','rj');return;}
  if(!f){toast('Selecciona una fecha','rj');return;}
  // Solo una entrada por día - sobreescribe si ya existe
  const existing=ST.pesos.findIndex(p=>p.f===f);
  if(existing>=0){
    ST.pesos[existing].v=n;
  } else {
    ST.pesos.push({f,v:n});
    ST.pesos.sort((a,b)=>a.f.localeCompare(b.f));
  }
  save();
  document.getElementById('pesoVal').value='';
  toast('Peso guardado ✓','vd');
  document.getElementById('ct').innerHTML=renderProgreso();
}

// ── REVISIÓN ──
function renderRevision(){
  const {semana,tipo}=ST.u;
  const revSems=tipo==='programa'?[4,8,12]:[3,7,11];
  const nextRev=revSems.find(s=>s>=semana)||revSems[revSems.length-1];
  const {done,fotos,medidas,preguntas}=ST.rev;
  const step=ST.revStep||0;
  if(done)return`<div class="enviado-state"><div class="es-txt"><b>✅ Revisión S${nextRev} enviada</b><small>Tu entrenador la revisará pronto</small></div><button class="btn btns btno" onclick="ST.rev.done=false;save();render()">Editar</button></div><div class="alert avd">Revisión enviada. Tu entrenador te contactará en breve.</div>`;
  const STEPS=['Fotos','Medidas','Preguntas'];
  const stepsBar=STEPS.map((s,i)=>`<div style="flex:1;text-align:center"><div style="height:5px;border-radius:3px;background:${i<step?'var(--vd)':i===step?'var(--nr)':'var(--bor)'};cursor:pointer;margin:0 2px 5px" onclick="ST.revStep=${i};render()"></div><div style="font-size:10.5px;font-weight:600;color:${i===step?'var(--az)':'var(--t3)'}">${s}</div></div>`).join('');
  let content='';
  if(step===0){
    const POSES=['Frente','Perfil Der.','Perfil Izq.','Espalda'];
    let fg=`<div class="rfg">`;
    POSES.forEach((pos,pi)=>{const k='rev_'+pi;const has=fotos[k];fg+=`<div class="rfb ${has?'done':''}" onclick="triggerRF(${pi})">${has?`<img src="${has}" alt="${pos}"><div class="rfb-lbl" style="background:rgba(0,0,0,.4);position:absolute;bottom:0;left:0;right:0;color:#fff;padding:4px 0">${pos}</div>`:`<span style="font-size:22px">📷</span><div class="rfb-lbl">${pos}</div>`}</div>`;});
    fg+=`</div><input type="file" accept="image/*" id="rfin" onchange="loadRF(this)">`;
    content=`<div class="alert aaz" style="line-height:1.7;margin-bottom:12px">
      📱 <b>Cómo hacer las fotos:</b><br>
      · Fondo liso, sin objetos detrás<br>
      · Móvil a altura de ombligo-pecho, apoyado (no selfie)<br>
      · Si puedes, graba un vídeo y saca una captura<br>
      · Sin móvil en la mano — pide ayuda o usa un trípode<br>
      · Buena luz natural
    </div>` + fg + `<button class="btn btnp btnf" style="margin-top:12px" onclick="ST.revStep=1;render()">Continuar →</button>`;
  }else if(step===1){
    const MEDS=[['peso','Peso corporal','kg'],['pecho','Pecho','cm'],['cintura','Cintura','cm'],['cadera','Cadera','cm'],['biceps','Bíceps (contraído)','cm'],['muslo','Muslo','cm'],['gemelo','Gemelo (contraído)','cm']];
    content=MEDS.map(([k,l,u])=>`<div style="margin-bottom:10px"><div style="font-size:13px;font-weight:600;margin-bottom:4px">${l} (${u})</div><input class="medin" type="number" inputmode="decimal" placeholder="0.0" value="${medidas[k]||''}" onchange="ST.rev.medidas['${k}']=this.value;save()"></div>`).join('');
    content+=`<div style="display:flex;gap:8px"><button class="btn btno" style="flex:1" onclick="ST.revStep=0;render()">← Atrás</button><button class="btn btnp" style="flex:1" onclick="ST.revStep=2;render()">Continuar →</button></div>`;
  }else{
    const PP=tipo==='programa'?['¿Cómo te sientes?','¿Cómo ha ido el entrenamiento estas semanas?','¿Cómo ha ido la nutrición?','¿Qué es lo que mejor ha funcionado?','¿Qué cambiarías de cara al siguiente bloque?']:['¿Cómo te sientes?','¿Cuáles han sido tus éxitos en estas semanas?','¿Cómo te has sentido con los éxitos que has conseguido?','¿Qué tal van tus entrenamientos?','¿Qué tal va tu nutrición?','¿Qué te gustaría mejorar en el siguiente bloque?','¿Hay algo que quieras comentarme?'];
    content=PP.map((q,i)=>`<div style="margin-bottom:12px"><div style="font-size:13.5px;font-weight:600;margin-bottom:5px">${i+1}. ${q}</div><textarea class="preqa" placeholder="Tu respuesta..." onchange="ST.rev.preguntas[${i}]=this.value;save()">${preguntas[i]||''}</textarea></div>`).join('');
    content+=`<div style="display:flex;gap:8px"><button class="btn btno" style="flex:1" onclick="ST.revStep=1;render()">← Atrás</button><button class="btn btnp" style="flex:1" onclick="enviarRev()">Enviar revisión ✓</button></div>`;
  }
  return`<div class="card" id="revCard" ontouchstart="revTouchStart(event)" ontouchend="revTouchEnd(event)"><div class="ch"><h2>📋 Revisión Semana ${nextRev}</h2><span class="badge bnr">Pendiente</span></div><div class="cb"><div style="display:flex;gap:4px;margin-bottom:14px">${stepsBar}</div>${content}</div></div>`;
}
let _rfIdx=0;
function triggerRF(i){_rfIdx=i;document.getElementById('rfin').click();}
function loadRF(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const revKey='rev_'+_rfIdx;
    ST.rev.fotos[revKey]=e.target.result;
    // También guardarlo en prog con el índice de revisión actual
    const {semana,tipo}=ST.u;
    const revSems=tipo==='programa'?[0,4,8,12]:[0,3,7,11];
    const gi=revSems.findIndex(s=>{const revSemAct=tipo==='programa'?[4,8,12]:[3,7,11];const nextRev=revSemAct.find(rs=>rs>=semana)||revSemAct[revSemAct.length-1];return s===nextRev;});
    if(gi>=0)ST.rev.fotos[`prog_${gi}_${_rfIdx}`]=e.target.result;
    save();render();
  };
  r.readAsDataURL(f);
}
function enviarRev(){ST.rev.done=true;save();render();toast('Revisión enviada ✓','vd');}

// ── PERFIL ──
function renderPerfil(){
  const u=ST.u;
  const DOCS=[
    {ico:'📄',nom:'Plan de nutrición PDF',sub:'Descargar PDF',key:'dieta'},
  ];
  const FAQS=[
    ['¿Qué hago si no puedo entrenar un día?','No te preocupes, desplaza ese entrenamiento al día siguiente y el resto de la semana también.'],
    ['¿Puedo cambiar algún ejercicio?','Sí, escríbele a tu entrenador por WhatsApp y te buscará una alternativa adaptada.'],
    ['¿Cómo mido brazos y gemelos?','Tensa el músculo al máximo y mide en la zona más ancha.'],
    ['¿Puedo saltarme alguna comida?','Intenta respetar el plan. Si tienes dudas, escríbele a tu entrenador.'],
    ['¿Puedo beber alcohol?','Lo mejor es evitarlo. Afecta a la recuperación y a la composición corporal.'],
    ['¿Qué hago si me encuentro mal o tengo alguna lesión?','Escríbele a tu entrenador y te indicará cómo adaptar el entrenamiento o la nutrición a tu situación.'],
  ];
  return`
<div style="text-align:center;margin-bottom:14px">
  <div class="pav">${u.init}</div>
  <div style="font-size:17px;font-weight:800">${u.nom}</div>
  <div style="font-size:13px;color:var(--t3);margin-top:3px">${u.plan} · Semana ${u.semana}/${u.semTotal}</div>
</div>
<div class="trainer-c">
  <div class="trainer-av">ÁC</div>
  <div><div style="font-size:14px;font-weight:700">Álvaro Casal</div><div style="font-size:12.5px;color:var(--az2);margin-top:2px">Tu entrenador personal</div></div>
  <a href="https://wa.link/bmmso8" target="_blank" class="btn btns btnp" style="margin-left:auto;flex-shrink:0;text-decoration:none">WhatsApp</a>
</div>
<div class="card" style="margin-bottom:11px"><div class="ch"><h2>📂 Mis documentos</h2></div><div class="cb" style="padding:10px 14px">
  ${DOCS.map(d=>{
    const semanaCompleta=[0,1,2,3,4,5,6].every(i=>ST.menuGuardado[i]&&Object.keys(ST.menuGuardado[i]).length>=4);
    return`<div class="compra-item" style="cursor:pointer" onclick="${semanaCompleta?'generateMenuPDF()':"toast('Guarda el menú de los 7 días primero','rj')"}">
      <span>${d.ico} ${d.nom}</span>
      <span style="font-size:12px;color:${semanaCompleta?'var(--vd)':'var(--t3)'}">
        ${semanaCompleta?'Descargar ↓':'Completa el menú primero'}
      </span>
    </div>`;
  }).join('')}
</div></div>
<div class="card"><div class="ch"><h2>❓ FAQ</h2></div>
  ${FAQS.map((f,i)=>`<div class="faq-item"><button class="faq-q" onclick="toggleFaq(${i})">${f[0]}<span id="fa${i}">▼</span></button><div class="faq-a" id="faq${i}">${f[1]}</div></div>`).join('')}
</div>
<div style="text-align:center;padding:20px 0 6px"><button class="btn btngr" onclick="logout()">Cerrar sesión</button></div>`;
}
function toggleFaq(i){const a=document.getElementById('faq'+i);const ic=document.getElementById('fa'+i);ic.textContent=a.classList.toggle('open')?'▲':'▼';}
function logout(){document.getElementById('app').classList.remove('on');document.getElementById('lw').style.display='flex';}

// ── MODAL / TOAST ──
function openModal(t,c){document.getElementById('modalT').textContent=t;document.getElementById('modalC').innerHTML=c;document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
function toast(msg,tipo){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(tipo?' '+tipo:'');setTimeout(()=>el.classList.remove('show'),2800);}

// ── SWIPE REVISIÓN ──
let _revTX=0;
function revTouchStart(e){_revTX=e.touches[0].clientX;}
function revTouchEnd(e){
  const dx=e.changedTouches[0].clientX-_revTX;
  if(Math.abs(dx)<50)return;
  const step=ST.revStep||0;
  if(dx<0&&step<2){ST.revStep=step+1;render();}
  else if(dx>0&&step>0){ST.revStep=step-1;render();}
}

// ── INIT ──
load();
</script>
</body>
</html>
