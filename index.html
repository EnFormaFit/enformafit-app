<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>EnFormaFit</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --az:#1A2B5A;--az2:#2E6DA4;--az3:#EEF3FA;--az4:#D6E8F5;
  --vd:#0DBF6F;--vd2:#D4F7E8;--vd3:#7BE8B4;
  --nr:#FF6B00;--nr2:#FFF0E5;
  --rj:#FF1A1A;--rj2:#FFE5E5;--rj3:#FF8888;
  --bg:#F4F5F8;--bor:#E2E6EF;--bor2:#F0F2F8;
  --t1:#1A2B5A;--t2:#5A6480;--t3:#9199AD;
  --r:12px;--sh:0 2px 8px rgba(26,43,90,.08);
  --nav:64px;--top:50px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:15px;overflow:hidden}

/* LOGIN */
.lw{position:fixed;inset:0;background:linear-gradient(160deg,var(--az),#0D1F45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.lb{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.llo{text-align:center;margin-bottom:20px}
.llo img{width:200px;height:auto;display:block;margin:0 auto 8px}
.llo small{font-size:12px;color:var(--t3)}
.lfi{margin-bottom:10px}
.lfi label{font-size:11.5px;font-weight:600;color:var(--t2);display:block;margin-bottom:3px}
.lfi input{width:100%;border:1.5px solid var(--bor);border-radius:10px;padding:11px 13px;font-size:15px;outline:none;font-family:inherit;transition:border .15s}
.lfi input:focus{border-color:var(--az2)}
.lbtn{width:100%;padding:13px;background:var(--vd);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.lerr{color:var(--rj);font-size:12px;text-align:center;margin-top:8px;display:none}

/* APP SHELL */
.app{display:none;position:fixed;inset:0;flex-direction:column}.app.on{display:flex}
.topbar{background:#fff;border-bottom:1px solid var(--bor);height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 15px;flex-shrink:0;z-index:20;position:relative}
.tsect{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--t2);white-space:nowrap}
.topbar img{height:28px;width:auto}

.tav{width:32px;height:32px;border-radius:50%;background:var(--az);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 14px 20px}
@media(min-width:768px){.content{max-width:700px;margin:0 auto;padding:20px 20px 28px}}

/* BOTTOM NAV */
.bnav{flex-shrink:0;height:var(--nav);background:#fff;border-top:1px solid var(--bor);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:768px){.bnav{max-width:700px;margin:0 auto;width:100%}}
.bni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;font-family:inherit;color:var(--t3);cursor:pointer;padding:4px;transition:color .15s;touch-action:manipulation;position:relative}
.bni.on{color:var(--az)}
.bni.ctr{background:var(--vd);border-radius:14px;margin:6px 4px;color:#fff;box-shadow:0 3px 12px rgba(13,191,111,.35)}
.bni.ctr.on{background:#09a85e}
.bni svg{width:22px;height:22px}
.bni span{font-size:10px;font-weight:600}
.bni-dot{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--rj);border:1.5px solid #fff}

/* CARDS */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--bor);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.ch{padding:12px 15px;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch h2{font-size:14px;font-weight:700}
.cb{padding:14px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.bvd{background:var(--vd2);color:#07854D}.baz{background:var(--az3);color:var(--az2)}.bnr{background:var(--nr2);color:#CC5500}.brj{background:var(--rj2);color:var(--rj)}

/* BANNERS */
.banner{border-radius:var(--r);padding:14px 16px;color:#fff;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden}
.banner.az{background:linear-gradient(135deg,var(--az),var(--az2))}.banner.nr{background:linear-gradient(135deg,var(--nr),#E65A00)}.banner.vd{background:linear-gradient(135deg,#09a85e,var(--vd))}

/* STATS */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(min-width:480px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border-radius:var(--r);border:1px solid var(--bor);padding:12px;text-align:center}
.stat-v{font-size:22px;font-weight:800;line-height:1;margin-bottom:2px}
.stat-l{font-size:10.5px;color:var(--t3);font-weight:500}

/* PROGRESS BAR */
.pb{height:6px;background:var(--bor);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .6s}

/* SEMANAS */
.semp{display:flex;gap:3px;flex-wrap:wrap;margin:8px 0}
.sw{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.sw-done{background:var(--vd);color:#fff}.sw-cur{background:var(--nr);color:#fff}.sw-rev{background:var(--az2);color:#fff}.sw-fut{background:var(--bg);color:var(--t3);border:1.5px solid var(--bor)}

/* PASOS */
.pasos-card{background:linear-gradient(135deg,#27AE60,#2ECC71);border-radius:var(--r);padding:14px 16px;color:#fff;margin-bottom:12px}
.pasos-n{font-size:30px;font-weight:800;line-height:1}
.pasos-bar{background:rgba(255,255,255,.25);border-radius:5px;height:7px;margin-top:8px;overflow:hidden}
.pasos-fill{height:100%;background:#fff;border-radius:5px}

/* RACHA */
.racha-card{background:linear-gradient(135deg,#E67E22,#F39C12);border-radius:var(--r);padding:12px 16px;color:#fff;display:flex;align-items:center;gap:12px;margin-bottom:12px}

/* ENTRENO */
.day-sticky{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 6px;margin:-14px -14px 12px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--bor2)}
@media(min-width:768px){.day-sticky{margin:-20px -20px 14px;padding-left:20px;padding-right:20px}}
.day-sel{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.day-sel::-webkit-scrollbar{display:none}
.day-b{flex-shrink:0;padding:7px 12px;border-radius:20px;border:1.5px solid var(--bor);background:#fff;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;text-align:center;line-height:1.3;transition:all .15s;touch-action:manipulation;-webkit-user-select:none}
.day-b.on{background:var(--az);border-color:var(--az);color:#fff}
.day-b.today{border-color:var(--vd);color:var(--vd)}.day-b.today.on{background:var(--vd);border-color:var(--vd);color:#fff}
.day-b.rest{color:var(--t3)}

/* EJERCICIOS */
.ejcard{background:#fff;border-radius:10px;border:1px solid var(--bor);margin-bottom:10px;overflow:hidden}
.ejhead{padding:12px 14px;display:flex;gap:10px;border-bottom:1px solid var(--bor2)}
.ejnum{width:26px;height:26px;border-radius:50%;background:var(--az);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ejnom{font-size:15px;font-weight:700;margin-bottom:2px}
.ejmeta{font-size:13px;color:var(--t3)}
.ejacl{font-size:12px;color:var(--t2);font-style:italic;margin-top:3px;line-height:1.4}
.ejyt{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;color:var(--rj);font-weight:700;text-decoration:none;background:var(--rj2);padding:4px 10px;border-radius:20px;border:1px solid var(--rj3)}
.grabar{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:700;background:var(--nr2);color:#CC5500;padding:4px 10px;border-radius:20px;border:1px solid #FFD4B0;margin-left:6px}

/* SERIES */
.serwrap{padding:10px 14px}
.serhd{display:grid;grid-template-columns:18px 62px 46px 44px 40px 30px;gap:4px;margin-bottom:7px;font-size:9.5px;color:var(--t3);font-weight:700;text-transform:uppercase;text-align:center}
.serrow{display:grid;grid-template-columns:18px 62px 46px 44px 40px 30px;gap:4px;align-items:center;margin-bottom:7px}
.sern{font-size:13px;font-weight:700;color:var(--t3);text-align:center}
.serant{font-size:11px;color:var(--t2);text-align:center;line-height:1.3;font-weight:500}
.sinp{border:1.5px solid var(--bor);border-radius:8px;padding:8px 4px;font-size:15px;font-weight:700;text-align:center;outline:none;font-family:inherit;width:100%;-webkit-appearance:none;transition:border .15s}
.sinp:focus{border-color:var(--az2)}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--bor);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;touch-action:manipulation;margin:0 auto;font-family:inherit}
.ck.on{background:var(--vd);border-color:var(--vd)}

/* PLEGADO EJERCICIO */
.ej-col{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-top:1px solid var(--bor2)}
.ej-col-info{font-size:12px;color:var(--t2)}
.ej-edit{font-size:12px;color:var(--az2);background:var(--az3);border:none;cursor:pointer;font-family:inherit;font-weight:600;padding:4px 9px;border-radius:6px}

/* HISTORIAL MODAL */
.hist-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none;align-items:flex-end;justify-content:center}
.hist-modal.show{display:flex}
.hist-box{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:75vh;overflow-y:auto}
.hist-weeks{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;scrollbar-width:none}
.hist-weeks::-webkit-scrollbar{display:none}
.hw{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1.5px solid var(--bor);background:#fff;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;touch-action:manipulation}
.hw.on{background:var(--az);border-color:var(--az);color:#fff}

/* TIMER */
.timer{display:none;position:fixed;bottom:calc(var(--nav)+12px);left:50%;transform:translateX(-50%);background:rgba(26,43,90,.95);color:#fff;border-radius:22px;padding:10px 20px;z-index:50;box-shadow:0 8px 28px rgba(0,0,0,.3);align-items:center;gap:12px}
.timer.show{display:flex}
.timer-n{font-size:28px;font-weight:800;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}

/* NUTRICIÓN */
.nut-sticky{position:sticky;top:0;z-index:10;background:var(--bg);margin:-14px -14px 0;padding:0 14px;border-bottom:2px solid var(--bor)}
@media(min-width:768px){.nut-sticky{margin:-20px -20px 0;padding:0 20px}}
.nut-body{padding-top:8px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--t3);border:none;background:none;cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;flex-shrink:0;transition:all .15s}
.tab.on{color:var(--az);border-bottom-color:var(--az);font-weight:700}
.day-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:7px 0 7px;border-top:1.5px solid var(--bor)}
.day-tabs::-webkit-scrollbar{display:none}
.dt{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1.5px solid var(--bor);background:#fff;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;touch-action:manipulation;transition:all .15s}
.dt.on{background:var(--az);border-color:var(--az);color:#fff}

/* ALIMENTOS */
.meal-sec{border-bottom:1px solid var(--bor2);padding-bottom:14px;margin-bottom:14px}
.meal-sec:last-child{border-bottom:none;margin-bottom:0}
.meal-title{font-size:15px;font-weight:800;margin-bottom:8px}
.cat-lbl{font-size:10.5px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;margin-top:8px}
.opts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.opt{padding:7px 11px;border-radius:20px;border:1.5px solid var(--bor);background:#fff;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;font-family:inherit;touch-action:manipulation;-webkit-user-select:none;transition:all .15s}
.opt small{display:block;font-size:10.5px;opacity:.6;margin-top:1px;pointer-events:none}
.opt *{pointer-events:none}
.opt.on{border-color:var(--vd);background:var(--vd2);color:#07854D;font-weight:600}
.fat-alert{background:var(--nr2);color:#CC5500;border:1px solid #FFD4B0;border-radius:8px;padding:8px 12px;font-size:12.5px;margin:6px 0;line-height:1.4}
.missing-alert{background:var(--rj2);color:var(--rj);border:1px solid var(--rj3);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:8px;display:none}

/* MENÚ PLEGADO */
.meal-col{border:1px solid var(--bor);border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden}
.meal-col-h{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;touch-action:manipulation}
.meal-col-title{font-size:14px;font-weight:700}
.meal-col-sub{font-size:12px;color:var(--t3);margin-top:2px}
.meal-col-body{padding:0 14px 12px;border-top:1px solid var(--bor2);display:none}
.meal-col-body.open{display:block}
.meal-alim{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bor2);font-size:13px}
.meal-alim:last-child{border-bottom:none}

/* LISTA COMPRA */
.compra-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bor2);font-size:14px}
.compra-item:last-child{border-bottom:none}

/* PROGRESO */
.pesob-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pesob-wrap input{border:1.5px solid var(--bor);border-radius:9px;padding:10px;font-size:14px;outline:none;font-family:inherit;width:100%;transition:border .15s}
.pesob-wrap input:focus{border-color:var(--az2)}
.macrog{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.maci{background:var(--bg);border-radius:9px;padding:11px;text-align:center;border:1px solid var(--bor)}
.macv{font-size:19px;font-weight:800}
.macl{font-size:10.5px;color:var(--t3);margin-top:2px;font-weight:500}

/* FOTOS */
.fscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.fgrp{flex-shrink:0;width:160px}
.fgrp-t{font-size:10.5px;font-weight:700;text-align:center;padding:4px 8px;border-radius:6px 6px 0 0}
.ft-vd{background:var(--vd);color:#fff}.ft-az{background:var(--az2);color:#fff}.ft-gr{background:var(--bg);color:var(--t3);border:1px solid var(--bor)}
.fslot{background:var(--bg);border:1.5px dashed var(--bor);border-radius:8px;width:100%;aspect-ratio:3/5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden;position:relative;transition:all .15s}
.fslot.has{border-style:solid;border-color:var(--vd3)}
.fslot.locked{opacity:.3;cursor:not-allowed;pointer-events:none}
.fslot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.fslot-lbl{font-size:10px;color:var(--t3);font-weight:600;text-align:center;z-index:1;padding:4px}

/* LOGROS */
.logro{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--bor2)}
.logro:last-child{border-bottom:none}
.logro.locked{opacity:.25}
.logro-ico{font-size:24px;flex-shrink:0}
.logro-nom{font-size:14px;font-weight:600}
.logro-desc{font-size:12px;color:var(--t3);margin-top:1px}

/* REVISIÓN */
.rfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rfb{border:2px dashed var(--bor);border-radius:10px;aspect-ratio:3/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;background:var(--bg);overflow:hidden;position:relative;touch-action:manipulation}
.rfb.done{border-color:var(--vd);border-style:solid;background:var(--vd2)}
.rfb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rfb-lbl{font-size:10.5px;color:var(--t3);font-weight:600;z-index:1;text-align:center;padding:4px}
.medin{width:100%;border:1.5px solid var(--bor);border-radius:9px;padding:10px 12px;font-size:15px;outline:none;font-family:inherit;transition:border .15s;-webkit-appearance:none;margin-bottom:10px}
.medin:focus{border-color:var(--az2)}
.preqa{width:100%;border:1.5px solid var(--bor);border-radius:9px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit;resize:none;min-height:70px;transition:border .15s;margin-bottom:10px}
.preqa:focus{border-color:var(--az2)}

/* CHECK-IN */
.ci-wrap{border:1.5px solid var(--bor);border-radius:10px;overflow:hidden;margin-bottom:8px}
.ci-hd{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:14px;font-weight:600;background:#fff;touch-action:manipulation}
.ci-hd.open{border-color:var(--az2)}
.ci-body{padding:14px;background:#fff;border-top:1px solid var(--bor2);display:none}
.ci-body.open{display:block}
.ci-q{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--t1)}
.dayrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dday{width:35px;height:35px;border-radius:50%;border:1.5px solid var(--bor);background:#fff;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;touch-action:manipulation;-webkit-user-select:none}
.dday.on{background:var(--vd);border-color:var(--vd);color:#fff}
.stars{display:flex;gap:8px;margin-bottom:12px}
.star{font-size:26px;cursor:pointer;opacity:.2;touch-action:manipulation;-webkit-user-select:none}
.star.on{opacity:1}

/* ENVIADO */
.sent{background:var(--vd2);border:1px solid var(--vd3);border-radius:10px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sent b{font-size:14px;color:#07854D;display:block}
.sent small{font-size:12px;color:#09a85e}

/* PERFIL */
.pav{width:64px;height:64px;border-radius:50%;background:var(--az);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 8px}
.trainer-c{display:flex;align-items:center;gap:12px;padding:13px;background:var(--az3);border-radius:10px;margin-bottom:12px;border:1px solid var(--az4)}
.trainer-av{width:44px;height:44px;border-radius:50%;background:var(--az);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.faq-item{border-bottom:1px solid var(--bor2)}
.faq-q{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:13.5px;font-weight:600;gap:8px;border:none;background:none;width:100%;text-align:left;font-family:inherit;color:var(--t1);touch-action:manipulation}
.faq-a{padding:0 14px 12px;font-size:13px;color:var(--t2);line-height:1.6;display:none}
.faq-a.open{display:block}

/* PERFIL DATOS */
.perfil-dato{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bor2);font-size:14px}
.perfil-dato:last-child{border-bottom:none}
.perfil-dato label{color:var(--t2);font-weight:500}
.perfil-dato .val{font-weight:700;color:var(--t1)}
.perfil-edit-input{border:1.5px solid var(--az2);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;outline:none;font-family:inherit;width:120px;text-align:right}

/* ALERTS */
.alert{padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:12px;line-height:1.5}
.avd{background:var(--vd2);color:#07854D;border:1px solid var(--vd3)}
.aaz{background:var(--az3);color:var(--az2);border:1px solid var(--az4)}

/* BUTTONS */
.btn{padding:10px 17px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;transition:all .15s;touch-action:manipulation;-webkit-user-select:none}
.btnp{background:var(--vd);color:#fff}.btno{background:#fff;color:var(--az2);border:1.5px solid var(--bor)}.btngr{background:var(--bg);color:var(--t2);border:1.5px solid var(--bor)}
.btnf{width:100%;padding:13px;margin-bottom:10px}.btns{padding:6px 13px;font-size:13px}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:540px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
.modal-opt{padding:12px 14px;border-radius:10px;border:1.5px solid var(--bor);margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:space-between;touch-action:manipulation}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav)+14px);left:50%;transform:translateX(-50%) translateY(14px);background:var(--az);color:#fff;padding:9px 18px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:200;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.vd{background:var(--vd)}.toast.rj{background:var(--rj)}

/* SWIPE REV */
.rev-steps{display:flex;gap:4px;margin-bottom:14px}
.rev-step{flex:1;height:5px;border-radius:3px;cursor:pointer}
.rs-done{background:var(--vd)}.rs-act{background:var(--nr)}.rs-fut{background:var(--bor)}
input[type=file]{display:none}
svg.cht{width:100%;overflow:visible}
</style>

// ── API LAYER ──
const API='https://enformafit-backend-production.up.railway.app';
let _tk=localStorage.getItem('ef_tk')||null;

async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(_tk)opts.headers['Authorization']='Bearer '+_tk;
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||String(r.status));
  return d;
}

async function doLogin(){
  const e=document.getElementById('le').value.trim();
  const p=document.getElementById('lp').value;
  const errEl=document.getElementById('lerr');
  if(!e||!p){errEl.textContent='Rellena email y contraseña';errEl.style.display='block';return;}
  errEl.style.display='none';
  const btn=document.querySelector('.lbtn');
  if(btn)btn.textContent='Entrando...';
  try{
    const data=await api('POST','/api/auth/login',{email:e,password:p});
    _tk=data.token;
    localStorage.setItem('ef_tk',_tk);
    localStorage.setItem('ef_role',data.role||'cliente');
    await loadClienteData();
    showApp();
  }catch(err){
    errEl.textContent=err.message.includes('Credenciales')||err.message==='401'?'Email o contraseña incorrectos':err.message;
    errEl.style.display='block';
    if(btn)btn.textContent='Entrar →';
  }
}

async function loadClienteData(){
  try{
    // 1. Mi plan completo (rutina + nutricion + semana)
    const plan=await api('GET','/api/entreno/mi-plan');
    
    // 2. Perfil
    const perfil=await api('GET','/api/clientes/me/perfil');
    const nom=perfil.nombre||ST.u.nom;
    const partes=nom.trim().split(' ');
    const init=(partes[0]?.[0]||'')+(partes[1]?.[0]||'');
    ST.u.nom=nom;
    ST.u.init=init.toUpperCase()||'CL';
    ST.u.tipo=perfil.tipo==='1a1'?'uno':'programa';
    ST.u.semTotal=perfil.tipo==='1a1'?13:14;
    ST.u.lesiones=perfil.lesiones||'';
    ST.u.altura=perfil.altura||ST.u.altura||175;
    ST.u.diasEnt=perfil.dias_entreno||ST.u.diasEnt||4;
    if(perfil.fecha_nacimiento)ST.u.dob=perfil.fecha_nacimiento.split('T')[0];
    if(perfil.peso_inicial)ST.pesoInicial=parseFloat(perfil.peso_inicial);

    // Apply plan data
    if(plan){
      ST.u.semana=plan.semana_actual||ST.u.semana;
      ST.u.inicioBloque=plan.fecha_inicio?plan.fecha_inicio.split('T')[0]:ST.u.inicioBloque;
      ST.objPeso=plan.objetivo_kg||ST.objPeso;
      ST.u.obj=ST.objPeso;
      
      // Macros from plan
      if(plan.macros){
        ST.p.macro.kcal=plan.macros.kcal||ST.p.macro.kcal;
        ST.p.macro.p=plan.macros.p||ST.p.macro.p;
        ST.p.macro.c=plan.macros.c||ST.p.macro.c;
        ST.p.macro.g=plan.macros.g||ST.p.macro.g;
      }
      
      // Load real rutina days into DIAS
      if(plan.rutina_dias&&Object.keys(plan.rutina_dias).length>0){
        const DIA_NAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
        const DIA_TIPOS=['Pierna','Torso','Descanso','Empuje','Tracción','Descanso','Descanso'];
        // Reset DIAS
        for(let di=0;di<7;di++){
          const ejes=plan.rutina_dias[String(di)];
          if(ejes&&ejes.length>0){
            DIAS[di]={cod:DIA_NAMES[di].toUpperCase(),nom:DIA_NAMES[di],
              tipo:ejes.length+' ejercicios',rest:false,
              ejercicios:ejes.map(e=>({nom:e.nom,sets:e.sets,reps:e.reps,
                rir:String(e.rir||1),acl:e.acl||'',url:e.url||''}))};
          } else {
            DIAS[di]={cod:DIA_NAMES[di].toUpperCase(),nom:DIA_NAMES[di],
              tipo:'Descanso',rest:true,ejercicios:[]};
          }
        }
      }
      
      // Load nutrition plan from alimentos
      if(plan.alimentos&&Object.keys(plan.alimentos).length>0){
        const FRUTA_KCAL=110; // kcal por pieza estándar
        const MEAL_NAMES={desayuno:'Desayuno',comida:'Comida',cena:'Cena',snack:'Snack'};
        // Build ST.menu from alimentos
        const newMenu={};
        Object.entries(plan.alimentos).forEach(([meal,items])=>{
          if(!items||!items.length)return;
          newMenu[meal]=items.map(it=>{
            // Nutrition values per 100g
            const r100=it.k100||((it.p100||0)*4+(it.c100||0)*4+(it.g100||0)*9);
            return{
              nom:it.nom,cantidad:it.cantidad,u:it.u||'g',cat:it.cat,
              kcal:Math.round(r100*it.cantidad/100),
              prot:+(it.p100||0)*it.cantidad/100,
              carbs:+(it.c100||0)*it.cantidad/100,
              grasa:+(it.g100||0)*it.cantidad/100,
            };
          });
          // Add fruta to desayuno, comida, cena if not present
          const hasFruta=items.some(it=>it.cat==='fruta');
          const hasHidrat=items.find(it=>it.cat==='hidrat');
          if(!hasFruta&&['desayuno','comida','cena'].includes(meal)&&hasHidrat){
            // Reduce hidrat by 20g to compensate fruta kcal
            hasHidrat.cantidad=Math.max(0,hasHidrat.cantidad-20);
            newMenu[meal].push({nom:'Fruta (1 pieza)',cantidad:1,u:'pieza',cat:'fruta',
              kcal:110,prot:0.5,carbs:25,grasa:0.3});
          }
        });
        if(Object.keys(newMenu).length>0)ST.menu=newMenu;
      }
    }

    // 3. Pesos desde BD
    try{
      const pesosAPI=await api('GET','/api/entreno/peso');
      if(pesosAPI&&pesosAPI.length){
        ST.pesos=pesosAPI.map(p=>({f:p.fecha.split('T')[0],v:parseFloat(p.peso)}))
          .sort((a,b)=>a.f.localeCompare(b.f));
        ST.pesoInicial=ST.pesos[0]?.v||ST.pesoInicial;
      }
    }catch(e){}

    // 4. Historial entreno desde BD
    try{
      const histAPI=await api('GET','/api/entreno/mi-historial');
      if(histAPI&&histAPI.length){
        const newHist={};
        histAPI.forEach(r=>{
          if(!newHist[r.ejercicio])newHist[r.ejercicio]={semanas:{}};
          const sem=String(r.semana);
          if(!newHist[r.ejercicio].semanas[sem])newHist[r.ejercicio].semanas[sem]={series:[]};
          newHist[r.ejercicio].semanas[sem].series[r.serie-1]={
            kg:String(r.kg),reps:String(r.reps_reales),done:r.completada};
        });
        if(Object.keys(newHist).length>0)ST.histEnt=newHist;
      }
    }catch(e){}

    // 5. Merge localStorage para datos offline
    try{
      const cached=localStorage.getItem('ef8');
      if(cached){
        const c=JSON.parse(cached);
        if(c.ejStates)ST.ejStates=c.ejStates;
        if(c.rev&&!ST.rev?.done)ST.rev=c.rev;
        if(c.ci&&!ST.ci?.done)ST.ci=c.ci;
        if(c.listaCheck)ST.listaCheck=c.listaCheck;
      }
    }catch(e){}

    localStorage.setItem('ef_nom',nom);
    console.log('[APP] Datos cargados: S'+ST.u.semana+' | '+Object.keys(ST.menu||{}).length+' comidas | '+ST.pesos.length+' pesos');
  }catch(err){
    console.warn('[APP] Error cargando datos:',err.message);
    try{
      const cached=localStorage.getItem('ef8');
      if(cached)Object.assign(ST,JSON.parse(cached));
    }catch(e){}
  }
}

// ── ENTRENO ──
let curDay=null,_entTX=0;

function renderEntreno(){
  if(!ST.ejStates)ST.ejStates={};
  if(curDay===null)curDay=[6,0,1,2,3,4,5][new Date().getDay()]||0;
  return buildEntHTML(curDay);
}

function buildEntHTML(di){
  const d=DIAS[di];
  const todayIdx=[6,0,1,2,3,4,5][new Date().getDay()]||0;
  const dayBtns=DIAS.map((dd,i)=>`<button class="day-b${i===di?' on':''}${i===todayIdx?' today':''}${dd.rest?' rest':''}" onclick="curDay=${i};document.getElementById('ct').innerHTML=buildEntHTML(${i})">${dd.nom}<br><small style="font-size:9px;opacity:.6">${dd.tipo}</small></button>`).join('');

  let body='';
  if(d.rest){
    body=`<div class="card"><div class="cb" style="text-align:center;padding:28px 14px">
      <div style="font-size:48px;margin-bottom:10px">😴</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:8px">Día de descanso</div>
      <div style="font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:12px">El descanso es parte del entrenamiento. Es cuando el músculo crece y se recupera.</div>
      <div class="alert avd" style="text-align:left">💡 Aprovecha para acumular tus <b>${ST.pasos.obj.toLocaleString('es')} pasos</b> diarios y seguir tu plan de nutrición.</div>
    </div></div>`;
  } else {
    const grabIdxs=getGrabarIdxs(di);
    body=d.ejercicios.map((ej,ei)=>renderEj(ej,ei,di,grabIdxs)).join('');
    body+=`<button class="btn btnp btnf" onclick="guardarDia(${di})">Guardar entrenamiento ✓</button>`;
  }
  return`<div style="min-height:100%" ontouchstart="_entTX=event.touches?event.touches[0].clientX:0" ontouchend="swipeEnt(event,${di})">
    <div class="day-sticky"><div class="day-sel">${dayBtns}</div></div>
    ${body}
  </div>`;
}

function swipeEnt(e,di){
  if(!e.changedTouches)return;
  const dx=e.changedTouches[0].clientX-_entTX;
  if(Math.abs(dx)<55)return;
  if(dx<0&&di<DIAS.length-1){curDay=di+1;document.getElementById('ct').innerHTML=buildEntHTML(di+1);}
  else if(dx>0&&di>0){curDay=di-1;document.getElementById('ct').innerHTML=buildEntHTML(di-1);}
}

function getGrabarIdxs(di){
  const s=ST.u.semana;
  const seed=Math.floor((s-1)/2);
  const ejs=DIAS[di]?.ejercicios||[];
  if(!ejs.length)return[];
  const idxs=[];
  const n=Math.min(2,ejs.length);
  for(let i=0;i<n;i++){
    const idx=(seed*3+di*7+i*4)%ejs.length;
    if(!idxs.includes(idx))idxs.push(idx);
    else idxs.push((idx+1)%ejs.length);
  }
  return idxs;
}

function renderEj(ej,ei,di,grabIdxs){
  const key=`${di}_${ei}`;
  if(!ST.ejStates[key])ST.ejStates[key]={collapsed:false,series:Array.from({length:ej.sets||3},()=>({kg:'',repsH:'',done:false})),rest:ej.rest||120};
  const st=ST.ejStates[key];
  const esGrabar=(grabIdxs||[]).includes(ei);
  const hist=ST.histEnt&&ST.histEnt[ej.nom]?ST.histEnt[ej.nom]:null;
  const histSem6=hist&&hist.semanas&&hist.semanas['6']?hist.semanas['6']:null;

  if(st.collapsed){
    const done=st.series.filter(s=>s.done).length;
    const kgs=st.series.filter(s=>s.done).map(s=>s.kg||'BW').join('/');
    return`<div class="ejcard">
      <div class="ejhead" onclick="ST.ejStates['${key}'].collapsed=false;document.getElementById('ct').innerHTML=buildEntHTML(${di})">
        <div class="ejnum">${ei+1}</div>
        <div style="flex:1">
          <div class="ejnom">${ej.nom}${esGrabar?' 🎥':''}</div>
          <div class="ejmeta">${ej.sets}×${ej.reps} · RIR ${ej.rir||0}</div>
        </div>
      </div>
      <div class="ej-col">
        <div class="ej-col-info">✅ ${done}/${ej.sets} · ${kgs}kg</div>
        <button class="ej-edit" onclick="ST.ejStates['${key}'].collapsed=false;document.getElementById('ct').innerHTML=buildEntHTML(${di})">Editar</button>
      </div>
    </div>`;
  }

  let sers=`<div class="serwrap">`;
  if(ej.bw)sers+=`<div style="font-size:11px;color:var(--t3);margin-bottom:6px">💡 Deja vacío si es con peso corporal</div>`;

      <button class="ck ${s.done?'on':''}" onclick="toggleSer('${key}',${si},${di})">${s.done?'✓':''}</button>

  });
  sers+=`</div>`;

  const ytBtn=ej.url?`<a href="${ej.url}" target="_blank" class="ejyt">▶ Ver</a>`:'';
  const grabarBadge=esGrabar?`<span class="grabar">🎥 Grábalo</span>`:'';
  const histBtn=`<button onclick="openHistEj('${ej.nom.replace(/'/g,"\\'")}',${di},${ei})" style="font-size:11px;color:var(--az2);background:var(--az3);border:none;cursor:pointer;font-family:inherit;padding:4px 9px;border-radius:6px;margin-top:6px;font-weight:600">📊 Historial</button>`;

  return`<div class="ejcard">
    <div class="ejhead">
      <div class="ejnum">${ei+1}</div>
      <div style="flex:1">
        <div class="ejnom">${ej.nom}</div>
        <div class="ejmeta">${ej.sets} series · ${ej.reps} reps · RIR ${ej.rir||0} · ${Math.floor((ej.rest||120)/60)}:${String((ej.rest||120)%60).padStart(2,'0')}min desc.</div>
        ${ej.acl?`<div class="ejacl">${ej.acl}</div>`:''}
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">${ytBtn}${grabarBadge}${histBtn}</div>
      </div>
    </div>
    ${sers}
  </div>`;
}

function toggleSer(key,si,di){
  const s=ST.ejStates[key].series[si];s.done=!s.done;
  if(s.done)startTimer(ST.ejStates[key].rest||120);
  document.getElementById('ct').innerHTML=buildEntHTML(di);
}

function guardarDia(di){
  if(!ST.ejStates)ST.ejStates={};
  if(!ST.histEnt)ST.histEnt={};
  DIAS[di].ejercicios.forEach((ej,ei)=>{
    const key=`${di}_${ei}`;
    if(!ST.ejStates[key])ST.ejStates[key]={collapsed:true,series:Array.from({length:ej.sets||3},()=>({kg:'',repsH:'',done:false})),rest:ej.rest||120};
    const st=ST.ejStates[key];
    const doneSeries=st.series.filter(s=>s.done&&s.kg);
    if(doneSeries.length){
      if(!ST.histEnt[ej.nom])ST.histEnt[ej.nom]={semanas:{}};
      ST.histEnt[ej.nom].semanas[String(ST.u.semana)]={series:st.series.map(s=>({kg:s.kg||'',reps:s.repsH||'',done:s.done}))};
      ST.histEnt[ej.nom].series=st.series.map(s=>({kg:s.kg||'',reps:s.repsH||''}));
    }
    st.collapsed=true;
  });
  save();
  document.getElementById('ct').innerHTML=buildEntHTML(di);
  toast('Entrenamiento guardado ✓','vd');
}

let _timID=null,_timSec=0;
function startTimer(sec){
  _timSec=sec;const d=document.getElementById('timDiv');d.classList.add('show');
  clearInterval(_timID);
  const upd=()=>{_timSec--;document.getElementById('timN').textContent=Math.floor(_timSec/60)+':'+(String(_timSec%60).padStart(2,'0'));if(_timSec<=0){clearInterval(_timID);d.classList.remove('show');toast('¡Siguiente serie!','vd');}};

// ── NUTRICIÓN ──
let _NIT=[];

function nitP(di,meal,tipo,idx){const it=_NIT[idx];if(it)selProt(di,meal,it.nom,tipo,it);}
function nitI(di,meal,cat,idx){const it=_NIT[idx];if(it)selItem(di,meal,cat,it);}

function selProt(di,meal,nom,tipo,item){
  if(!ST.menu[di])ST.menu[di]={};
  if(!ST.menu[di][meal])ST.menu[di][meal]={};
  const cur=ST.menu[di][meal];
  if(cur.prot&&cur.prot.nom===nom&&cur.protType===tipo){delete cur.prot;delete cur.protType;}
  else{cur.prot=item;cur.protType=tipo;if(tipo==='grasa')delete cur.fat;}
  save();document.getElementById('ct').innerHTML=renderNutricion();
}
function selItem(di,meal,cat,item){
  if(!ST.menu[di])ST.menu[di]={};
  if(!ST.menu[di][meal])ST.menu[di][meal]={};
  const cur=ST.menu[di][meal];
  if(cur[cat]&&cur[cat].nom===item.nom)delete cur[cat];else cur[cat]=item;
  save();document.getElementById('ct').innerHTML=renderNutricion();
}

function renderNutricion(){
  const tab=ST.nutTab,di=ST.nutDay;
  const DSHORT=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const dayTabs=DSHORT.map((d,i)=>`<button class="dt ${i===di?'on':''}" onclick="ST.nutDay=${i};ST.nutEditing=false;document.getElementById('ct').innerHTML=renderNutricion()">${d}</button>`).join('');
  const dayTabsNav=DSHORT.map((d,i)=>`<button class="dt ${i===di?'on':''}" onclick="ST.nutDay=${i};ST.nutEditing=false;ST.nutTab='menu';document.getElementById('ct').innerHTML=renderNutricion()">${d}</button>`).join('');

  let body='';
  if(tab==='menu')body=renderMenuDia(di);
  else if(tab==='semana')body=renderSemana();
  else body=renderListaCompra();

  return`<div class="nut-sticky">
    <div class="tabs">
      <button class="tab ${tab==='menu'?'on':''}" onclick="ST.nutTab='menu';ST.nutEditing=false;document.getElementById('ct').innerHTML=renderNutricion()">Mi menú</button>
      <button class="tab ${tab==='semana'?'on':''}" onclick="ST.nutTab='semana';document.getElementById('ct').innerHTML=renderNutricion()">Semana</button>
      <button class="tab ${tab==='lista'?'on':''}" onclick="ST.nutTab='lista';document.getElementById('ct').innerHTML=renderNutricion()">Lista compra</button>
    </div>
    ${tab!=='lista'?`<div class="day-tabs">${tab==='menu'?dayTabs:dayTabsNav}</div>`:''}
  </div>
  <div class="nut-body">${body}</div>`;
}

function renderMenuDia(di){
  const guardado=ST.menuGuardado[di];
  if(guardado&&!ST.nutEditing)return renderMenuPlegado(di,guardado);
  return renderMenuEditor(di);
}

function renderMenuPlegado(di,g){
  const DNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

    const md=MENU[meal];
    const alims=[];

      if(ms[cat]){const it=ms[cat];alims.push({nom:it.nom,cant:cat==='verd'?null:it.cantidad,u:it.u||''});}
    });
    const isOpen=ST[`mopen_${di}_${mi}`]||false;
    out+=`<div class="meal-col">
      <div class="meal-col-h" onclick="ST['mopen_${di}_${mi}']=!ST['mopen_${di}_${mi}'];document.getElementById('ct').innerHTML=renderNutricion()">
        <div>
          <div class="meal-col-title">${ICONS[meal]} ${md.nom}</div>
          ${!isOpen&&alims.length?`<div class="meal-col-sub">${alims.map(a=>a.nom+(a.cant?` ${Math.round(a.cant)}${a.u}`:'')+(':'===a.u[-1]?'':'')).join(' · ')}</div>`:''}
        </div>
        <span style="color:var(--t3)">${isOpen?'▲':'▼'}</span>
      </div>
      <div class="meal-col-body ${isOpen?'open':''}">
        ${alims.map(a=>`<div class="meal-alim"><span>${a.nom}</span><span style="color:var(--t3);font-size:12px">${a.cant!=null?Math.round(a.cant)+(a.u||''):''}</span></div>`).join('')}
      </div>
    </div>`;
  });
  out+=`<div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="btn btnp" style="flex:1" onclick="ST.nutEditing=true;document.getElementById('ct').innerHTML=renderNutricion()">✏️ Editar menú</button>
    <button class="btn btno" style="flex:1" onclick="copiarDia(${di})">📋 Copiar a...</button>
  </div>`;
  out+=`<div class="alert aaz">💧 Bebe al menos 2L de agua hoy</div>`;
  return out;
}

function renderMenuEditor(di){
  _NIT=[];
  const isSuperavit=ST.p.def>0;
  const m=ST.menu[di]||{};
  const MEALS=['desayuno','comida','cena','snack'];
  let out='<div style="height:4px"></div>';

  MEALS.forEach(meal=>{
    const md=MENU[meal];
    const ms=m[meal]||{};
    const protType=ms.protType||null;
    const showFat=protType==='magra';
    const isFat=protType==='grasa';

    out+=`<div class="meal-sec"><div class="meal-title">${{desayuno:'🌅 Desayuno',comida:'☀️ Comida',cena:'🌙 Cena',snack:'🍎 Snack'}[meal]}</div>`;

    out+=`<div class="cat-lbl">Proteína magra</div><div class="opts">`;
    (md.proteinas_magras||[]).forEach(it=>{
      const on=ms.prot&&ms.prot.nom===it.nom&&protType==='magra';
      const idx=_NIT.push(it)-1;
      out+=`<button class="opt ${on?'on':''}" onclick="nitP(${di},'${meal}','magra',${idx})">${it.nom}<small>${it.cantidad}${it.u}</small></button>`;
    });
    out+=`</div>`;

    out+=`<div class="cat-lbl">Proteína con grasa</div><div class="opts">`;
    (md.proteinas_grasas||[]).forEach(it=>{
      const on=ms.prot&&ms.prot.nom===it.nom&&protType==='grasa';
      const idx=_NIT.push(it)-1;
      out+=`<button class="opt ${on?'on':''}" onclick="nitP(${di},'${meal}','grasa',${idx})">${it.nom}<small>${it.cantidad}${it.u}</small></button>`;
    });
    out+=`</div>`;

    if(isFat)out+=`<div class="fat-alert">⚠️ Esta proteína ya aporta grasa — no añadas más en esta comida.</div>`;

    out+=`<div class="cat-lbl">Hidrato</div><div class="opts">`;
    (md.hidratos||[]).forEach(it=>{
      const on=ms.hidrat&&ms.hidrat.nom===it.nom;
      const idx=_NIT.push(it)-1;
      out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','hidrat',${idx})">${it.nom}<small>${it.cantidad}${it.u}</small></button>`;
    });
    out+=`</div>`;

    if(md.verduras){
      out+=`<div class="cat-lbl">Verdura</div><div class="opts">`;
      md.verduras.forEach(it=>{
        const on=ms.verd&&ms.verd.nom===it.nom;
        const idx=_NIT.push(it)-1;
        out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','verd',${idx})">${it.nom}</button>`;
      });
      out+=`</div>`;
    }

    if(md.frutas){
      out+=`<div class="cat-lbl">Fruta</div><div class="opts">`;
      md.frutas.forEach(it=>{
        const on=ms.fruta&&ms.fruta.nom===it.nom;
        const idx=_NIT.push(it)-1;
        out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','fruta',${idx})">${it.nom}</button>`;
      });
      out+=`</div>`;
    }

    if(showFat&&md.grasas){
      out+=`<div class="cat-lbl">Grasa</div><div class="opts">`;
      md.grasas.forEach(it=>{
        const on=ms.fat&&ms.fat.nom===it.nom;
        const idx=_NIT.push(it)-1;
        out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','fat',${idx})">${it.nom}<small>${it.cantidad}${it.u}</small></button>`;
      });
      out+=`</div>`;
    }

    if(meal==='snack'&&isSuperavit&&md.grasas_superavit){
      out+=`<div class="cat-lbl" style="color:var(--nr)">Extra (superávit)</div><div class="opts">`;
      md.grasas_superavit.forEach(it=>{
        const on=ms.fat&&ms.fat.nom===it.nom;
        const idx=_NIT.push(it)-1;
        out+=`<button class="opt ${on?'on':''}" onclick="nitI(${di},'${meal}','fat',${idx})">${it.nom}<small>${it.cantidad}${it.u}</small></button>`;
      });
      out+=`</div>`;
    }
    out+=`</div>`;
  });

  out+=`<div id="missing-alert" class="missing-alert"></div>`;
  out+=`<div style="display:flex;gap:8px;margin-bottom:10px">
    <button class="btn btno" style="flex:1" onclick="copiarDia(${di})">📋 Copiar a...</button>
    <button class="btn btnp" style="flex:1" onclick="guardarMenu(${di})">Guardar ✓</button>
  </div>`;
  out+=`<div class="alert aaz">💧 Bebe al menos 2L de agua hoy</div>`;
  return out;
}

function guardarMenu(di){
  const MEALS=['desayuno','comida','cena','snack'];
  const m=ST.menu[di]||{};
  const NAMES={desayuno:'Desayuno',comida:'Comida',cena:'Cena',snack:'Snack'};
  const faltantes=[];
  MEALS.forEach(meal=>{
    const ms=m[meal]||{};
    const md=MENU[meal];
    const n=NAMES[meal];
    if(!ms.prot)faltantes.push(n+': falta proteína');
    if(!ms.hidrat)faltantes.push(n+': falta hidrato');
    if(ms.prot&&ms.protType==='magra'&&md.grasas&&md.grasas.length&&!ms.fat)faltantes.push(n+': falta grasa');
    if((meal==='comida'||meal==='cena')&&md.verduras&&md.verduras.length&&!ms.verd)faltantes.push(n+': falta verdura');
    if(meal==='desayuno'&&md.frutas&&md.frutas.length&&!ms.fruta)faltantes.push(n+': falta fruta');
  });
  if(faltantes.length){
    const al=document.getElementById('missing-alert');
    if(al){al.style.display='block';al.textContent='⚠️ '+faltantes.join(' · ');}
    toast('Revisa lo que falta','rj');return;
  }
  ST.menuGuardado[di]=JSON.parse(JSON.stringify(m));
  ST.nutEditing=false;save();
  document.getElementById('ct').innerHTML=renderNutricion();
  document.getElementById('ct').scrollTop=0;
  toast('Menú guardado ✓','vd');
}

let _copyFrom=-1,_copyTargets=[];
function copiarDia(di){
  _copyFrom=di;_copyTargets=[];
  const DNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const opts=DNAMES.map((d,i)=>i===di?'':
    `<div class="modal-opt" id="copt${i}" onclick="toggleCopy(${i})" style="background:${_copyTargets.includes(i)?'var(--vd2)':''}">
      ${d}<span id="coptck${i}" style="color:var(--vd)">${_copyTargets.includes(i)?'✓':''}</span>
    </div>`
  ).join('');
  openModal('Copiar menú de '+DNAMES[di]+' a...',opts+`<button class="btn btnp btnf" style="margin-top:8px" onclick="confirmCopy()">Copiar ✓</button>`);
}
function toggleCopy(i){
  const idx=_copyTargets.indexOf(i);
  if(idx>=0)_copyTargets.splice(idx,1);else _copyTargets.push(i);
  const el=document.getElementById('copt'+i);const ck=document.getElementById('coptck'+i);
  if(el)el.style.background=_copyTargets.includes(i)?'var(--vd2)':'';
  if(ck)ck.textContent=_copyTargets.includes(i)?'✓':'';
}
function confirmCopy(){
  if(!_copyTargets.length){toast('Selecciona al menos un día','rj');return;}
  const DNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  _copyTargets.forEach(to=>{
    ST.menu[to]=JSON.parse(JSON.stringify(ST.menu[_copyFrom]||{}));
    ST.menuGuardado[to]=JSON.parse(JSON.stringify(ST.menuGuardado[_copyFrom]||{}));
  });
  save();closeModal();toast('Copiado a '+_copyTargets.map(t=>DNAMES[t]).join(', '),'vd');
}

function renderListaCompra(){
  const totals={};const verdRac={};
  if(!ST.listaCheck)ST.listaCheck={};
  Object.values(ST.menuGuardado).forEach(dia=>{
    if(typeof dia!=='object')return;
    Object.values(dia).forEach(meal=>{
      if(typeof meal!=='object')return;
      if(meal.verd){const n=meal.verd.nom;verdRac[n]=(verdRac[n]||0)+1;}
      ['prot','hidrat','fat','fruta'].forEach(cat=>{
        if(meal[cat]){const it=meal[cat];if(!totals[it.nom])totals[it.nom]={nom:it.nom,u:it.u||'',cantidad:0};totals[it.nom].cantidad+=it.cantidad||0;}
      });
    });
  });
  const items=[...Object.values(totals).sort((a,b)=>a.nom.localeCompare(b.nom)),
               ...Object.entries(verdRac).sort((a,b)=>a[0].localeCompare(b[0])).map(([nom,r])=>({nom,u:'rac',cantidad:r,esVerd:true}))];
  if(!items.length)return`<div class="card"><div class="cb" style="text-align:center;padding:24px;color:var(--t3)">Configura tu menú primero</div></div>`;
  return`<div class="card"><div class="ch"><h2>🛒 Lista de la compra</h2><button class="btn btns btngr" onclick="ST.listaCheck={};save();document.getElementById('ct').innerHTML=renderNutricion()">Reiniciar</button></div><div class="cb">
    ${items.map(it=>{
      const chk=ST.listaCheck[it.nom]||false;
      const cant=it.esVerd?it.cantidad+' ración'+(it.cantidad>1?'es':''):Math.round(it.cantidad)+(it.u||'');
      return`<div class="compra-item" style="opacity:${chk?.4:1}">
        <span style="text-decoration:${chk?'line-through':'none'};color:${chk?'var(--t3)':'inherit'}">${it.nom}</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-weight:700;color:${chk?'var(--t3)':'var(--az)'}">${cant}</span>
          <button onclick="ST.listaCheck['${it.nom}']=!ST.listaCheck['${it.nom}'];save();document.getElementById('ct').innerHTML=renderNutricion()" style="width:28px;height:28px;border-radius:7px;border:2px solid ${chk?'var(--vd)':'var(--bor)'};background:${chk?'var(--vd)':'#fff'};cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;touch-action:manipulation">${chk?'✓':''}</button>
        </div>
      </div>`;
    }).join('')}
  </div></div>`;
}

function generateMenuPDF(){
  const DNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const MEALS=['desayuno','comida','cena','snack'];
  const MEAL_NOM={desayuno:'Desayuno',comida:'Comida',cena:'Cena',snack:'Snack'};

// ── PROGRESO ──
function buildPesoGridApp(pesos,inicioBloque,semActual){
  if(!pesos||!pesos.length)return'<div style="color:var(--t3);font-size:12px;text-align:center;padding:8px">Sin registros de peso aún</div>';
  var DN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  var fi=inicioBloque?new Date(inicioBloque):null;
  var pm={};var maxS=parseInt(semActual)||1;
  pesos.forEach(function(p){
    var d=new Date(p.f);var sem=1;
    if(fi){var diff=Math.floor((d-fi)/(7*24*60*60*1000));sem=Math.max(1,diff+1);}
    var dw=d.getDay();var di=dw===0?6:dw-1;
    if(!pm[sem])pm[sem]={};pm[sem][di]=p.v;
    if(sem>maxS)maxS=sem;
  });
  var sa=[];for(var i=0;i<=maxS;i++)sa.push(i);
  var md={};
  sa.forEach(function(s){
    var vs=Object.values(pm[s]||{}).filter(function(v){return v>0;});
    md[s]=vs.length?+(vs.reduce(function(a,b){return a+b;},0)/vs.length).toFixed(1):null;
  });
  var h='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="border-collapse:collapse;font-size:10.5px;min-width:'+(52+sa.length*52)+'px">';
  h+='<thead><tr style="background:var(--az)"><th style="padding:4px 7px;text-align:left;color:rgba(255,255,255,.8);font-size:9px;position:sticky;left:0;background:var(--az)">Día</th>';
  sa.forEach(function(s){h+='<th style="padding:4px 8px;text-align:center;color:#fff;font-size:9px;min-width:48px">'+(s===0?'S0':'S'+s)+'</th>';});
  h+='</tr></thead><tbody>';
  DN.forEach(function(d,di){
    h+='<tr><td style="padding:4px 7px;font-weight:700;font-size:9px;color:var(--t2);background:var(--bg);position:sticky;left:0">'+d+'</td>';
    sa.forEach(function(s){
      var v=pm[s]&&pm[s][di]!=null?pm[s][di]:null;var m=md[s];
      var bg=v==null?'transparent':m&&v>m?'rgba(255,26,26,.1)':m&&v<m?'rgba(13,191,111,.1)':'transparent';
      var col=v==null?'#ccc':m&&v>m?'var(--rj)':m&&v<m?'var(--vd)':'var(--t1)';
      h+='<td style="padding:4px 5px;text-align:center;background:'+bg+';color:'+col+';font-weight:'+(v?'700':'400')+'">'+(v||'—')+'</td>';
    });
    h+='</tr>';
  });
  h+='<tr style="background:var(--az3);border-top:2px solid var(--az4)"><td style="padding:4px 7px;font-weight:700;font-size:9px;color:var(--az);background:var(--az3);position:sticky;left:0">Media</td>';
  sa.forEach(function(s){h+='<td style="padding:4px 5px;text-align:center;font-weight:800;font-size:11px;color:var(--az)">'+(md[s]||'—')+'</td>';});
  h+='</tr><tr><td style="padding:4px 7px;font-weight:700;font-size:9px;color:var(--t3);background:#fff;position:sticky;left:0">Cambio</td>';
  sa.forEach(function(s,i){
    var c=md[s];var p=i>0?md[sa[i-1]]:null;var str='—',col='var(--t3)';
    if(c!=null&&p!=null){var dif=+(c-p).toFixed(1);str=(dif>0?'+':'')+dif;col=dif<0?'var(--vd)':dif>0?'var(--rj)':'var(--t3)';}
    h+='<td style="padding:4px 5px;text-align:center;font-weight:700;color:'+col+'">'+str+'</td>';
  });
  h+='</tr></tbody></table></div>';return h;
}

      <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="#E2E6EF" stroke-width="1"/>
      <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#E2E6EF" stroke-width="1"/>

      ${dots}
    </svg>`;
  }


  // Tabla pesos grid

  const pesoGridSection=`<div class="card" style="margin:12px 0"><div style="font-size:13px;font-weight:700;margin-bottom:8px">📊 Registro de pesos</div>${pesoGridHTML}</div>`;

  // Fotos

      </div>`;

    fotosH+=`</div>`;

  fotosH+=`</div><input type="file" accept="image/*" id="pfin" onchange="loadPF(this)">`;

  // Medidas comparativa
  const MEDS=[['peso','Peso','kg'],['pecho','Pecho','cm'],['cintura','Cintura','cm'],['cadera','Cadera','cm'],['bicepsd','Bíceps der.','cm'],['bicepsi','Bíceps izq.','cm'],['muslod','Muslo der.','cm'],['musloi','Muslo izq.','cm'],['gemelod','Gemelo der.','cm'],['gemeloi','Gemelo izq.','cm']];

    ${pesos.length?`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px">
      <div class="maci"><div class="macv" style="color:var(--t2);font-size:17px">${ST.pesoInicial}kg</div><div class="macl">Peso inicial</div></div>
      <div class="maci"><div class="macv" style="color:var(--az2);font-size:17px">${ST.objPeso}kg</div><div class="macl">Objetivo</div></div>

      <div class="maci"><div class="macv" style="color:var(--az);font-size:17px">${left>0?left.toFixed(1)+'kg':'✅'}</div><div class="macl">Para objetivo</div></div>
      <div class="maci"><div class="macv" style="color:var(--az2);font-size:17px">${ST.bajanSem}kg</div><div class="macl">Ritmo/sem</div></div>
      <div class="maci"><div class="macv" style="color:var(--az);font-size:17px">${semsTotal}sem</div><div class="macl">Sem. totales</div></div>
    </div>
    ${chartHTML}
    <div style="cursor:pointer;margin-top:10px;display:flex;justify-content:space-between" onclick="ST.pesosOpen=!ST.pesosOpen;document.getElementById('ct').innerHTML=renderProgreso()">

let _pfGi=0,_pfPi=0;
function triggerPF(gi,pi){_pfGi=gi;_pfPi=pi;document.getElementById('pfin').click();}
function loadPF(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{ST.rev.fotos[`prog_${_pfGi}_${_pfPi}`]=e.target.result;save();render();};r.readAsDataURL(f);}
function addPeso(){
  const v=document.getElementById('pesoVal').value;
  const f=document.getElementById('pesoFecha').value;
  const n=parseFloat(v);
  if(isNaN(n)||n<30||n>300){toast('Peso inválido','rj');return;}
  if(!f){toast('Selecciona una fecha','rj');return;}
  const i=ST.pesos.findIndex(p=>p.f===f);
  if(i>=0)ST.pesos[i].v=n;
  else{ST.pesos.push({f,v:n});ST.pesos.sort((a,b)=>a.f.localeCompare(b.f));}
  save();toast('Peso guardado ✓','vd');
  if(_tk)api('POST','/api/entreno/peso',{fecha:f,peso:n}).catch(e=>console.warn('[API] Peso:',e));
  document.getElementById('ct').innerHTML=renderProgreso();

function renderRevision(){
  const {semana,tipo,inicioBloque}=ST.u;
  const semTotal=tipo==='programa'?13:12;
  const revSems=tipo==='programa'?[4,8,12]:[3,7,11];
  const nextRev=revSems.find(rs=>rs>=semana)||revSems[revSems.length-1];
  const {done,fotos,medidas,preguntas}=ST.rev;
  const step=ST.rev.step||0;

  // Calcular fecha de cada revisión
  function revFecha(rs){
    if(!inicioBloque)return'';
    const d=new Date(inicioBloque);
    d.setDate(d.getDate()+(rs-1)*7);
    return d.toLocaleDateString('es',{day:'numeric',month:'short'});
  }

  // Historial de revisiones arriba
  let histH='<div class="card" style="margin-bottom:12px"><div class="ch"><h2>📋 Revisiones del bloque</h2></div><div class="cb" style="padding:0">';
  revSems.forEach(rs=>{
    const isPast=rs<nextRev;
    const isCur=rs===nextRev;
    const isFut=rs>nextRev;
    const hasData=ST.revHistorial&&ST.revHistorial[rs];
    const ico=isPast?'✅':isCur?'⏳':'🔒';
    const col=isCur?'var(--nr)':isPast?'var(--vd)':'var(--t3)';
    const txt=isPast?(hasData?'Completada · Toca para ver/editar':'Pasada · Sin datos'):isCur?'Pendiente':'Próxima';
    const fecha=revFecha(rs);
    const clickable=isPast||isCur;
    histH+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--bor2);cursor:${clickable?'pointer':'default'}" ${isPast?'onclick="verRevAnterior('+rs+')"':isCur?'onclick="document.getElementById(\'rev-actual\').scrollIntoView({behavior:\'smooth\'})"':''}>
      <div>
        <div style="font-size:14px;font-weight:700;color:${col}">${ico} Semana ${rs} ${fecha?'· <span style="font-weight:400;font-size:12px;color:var(--t3)">~'+fecha+'</span>':''}</div>
        <div style="font-size:12px;color:var(--t3);margin-top:2px">${txt}</div>
      </div>
      ${clickable?`<span style="font-size:12px;color:var(--az2);font-weight:700">${isPast?(hasData?'Ver/Editar →':'Sin datos'):'Ir →'}</span>`:''}
    </div>`;
  });
  histH+='</div></div>';

  if(done)return histH+`<div class="sent" id="rev-actual"><div><b>✅ Revisión S${nextRev} enviada</b><small>Tu entrenador la revisará en breve</small></div><button class="btn btns btno" onclick="ST.rev.done=false;save();render()">Editar</button></div>`;

  // Steps
  const PP=tipo==='programa'?
    ['¿Cómo te sientes esta semana?','¿Cómo han ido los entrenamientos?','¿Cómo ha ido la nutrición?','¿Qué funcionó mejor?','¿Qué cambiarías?']:
    ['¿Cómo te sientes esta semana?','¿Cuáles fueron tus mayores éxitos?','¿Cómo te sentiste con ellos?','¿Qué tal los entrenamientos?','¿Qué tal la nutrición?','¿Qué mejorarías?','¿Algo más que quieras compartir?'];

  const POSES=['Frente','Perfil der.','Perfil izq.','Espalda'];
  const MEDS=[['peso','Peso (kg)'],['pecho','Pecho (cm)'],['cintura','Cintura (cm)'],['cadera','Cadera (cm)'],['bicepsd','Bíceps der. (cm)'],['bicepsi','Bíceps izq. (cm)'],['muslod','Muslo der. (cm)'],['musloi','Muslo izq. (cm)'],['gemelod','Gemelo der. (cm)'],['gemeloi','Gemelo izq. (cm)']];

  const stepLabels=['📸 Fotos','📏 Medidas','💬 Preguntas'];
  const stepsBar=stepLabels.map((l,i)=>`<div class="rev-step ${i<step?'rs-done':i===step?'rs-act':'rs-fut'}" onclick="ST.rev.step=${i};render()" title="${l}"></div>`).join('');

  let content='';
  if(step===0){
    // Fotos + cuerpo
    content=`<div style="font-size:13px;color:var(--t2);margin-bottom:12px">Sube 4 fotos comparativas: frente, dos perfiles y espalda.</div>`;
    content+=`<div class="rfg">`;
    POSES.forEach((pos,pi)=>{
      const f=fotos['rev_'+pi];
      content+=`<div class="rfb ${f?'done':''}" onclick="triggerRF(${pi})">
        ${f?`<img src="${f}"><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);color:#fff;font-size:10px;font-weight:600;text-align:center;padding:3px">${pos}</div>`:`<div style="font-size:24px">📷</div><div class="rfb-lbl">${pos}</div>`}
      </div>`;
    });
    content+=`</div><input type="file" accept="image/*" id="rfin" onchange="loadRF(this)">`;
    content+=`<button class="btn btnp btnf" onclick="ST.rev.step=1;render()">Siguiente → Medidas</button>`;
  }
  else if(step===1){
    content=`<div style="display:flex;gap:12px;align-items:flex-start">
      <div style="flex:1">
        <div style="font-size:13px;color:var(--t2);margin-bottom:12px">Mídete en ayunas, sin ropa, con cinta métrica.</div>
        ${MEDS.map(([k,l])=>`<div style="margin-bottom:8px"><label style="font-size:11.5px;font-weight:700;color:var(--t2);display:block;margin-bottom:3px">${l}</label><input class="medin" type="number" inputmode="decimal" placeholder="—" value="${medidas[k]||''}" onchange="ST.rev.medidas['${k}']=this.value;save()" step="0.1"></div>`).join('')}
      </div>
      <img src="data:image/png;base64,${BODY_B64}" style="width:100px;flex-shrink:0;margin-top:32px;opacity:.85" alt="Guía de medidas">
    </div>`;
    content+=`<div style="display:flex;gap:8px">
      <button class="btn btno" style="flex:1" onclick="ST.rev.step=0;render()">← Atrás</button>
      <button class="btn btnp" style="flex:1" onclick="ST.rev.step=2;render()">Siguiente → Preguntas</button>
    </div>`;
  }
  else{
    content=PP.map((q,i)=>`<div style="margin-bottom:12px"><div style="font-size:13.5px;font-weight:600;margin-bottom:5px">${i+1}. ${q}</div><textarea class="preqa" placeholder="Tu respuesta..." onchange="ST.rev.preguntas[${i}]=this.value;save()">${preguntas[i]||''}</textarea></div>`).join('');
    content+=`<div style="display:flex;gap:8px">
      <button class="btn btno" style="flex:1" onclick="ST.rev.step=1;render()">← Atrás</button>
      <button class="btn btnp" style="flex:1" onclick="enviarRev()">Enviar ✓</button>
    </div>`;
  }

  return histH+`<div class="card" id="rev-actual">
    <div class="ch"><h2>📋 Revisión Semana ${nextRev}</h2><span class="badge bnr">Pendiente</span></div>
    <div class="cb">
      <div class="rev-steps" style="margin-bottom:14px">${stepsBar}</div>
      <div style="display:flex;gap:6px;margin-bottom:14px">
        ${stepLabels.map((l,i)=>`<div style="font-size:11px;font-weight:${i===step?'700':'400'};color:${i===step?'var(--nr)':i<step?'var(--vd)':'var(--t3)'};cursor:pointer;padding:4px 8px;border-radius:6px;background:${i===step?'var(--nr2)':i<step?'var(--vd2)':'var(--bg)'}" onclick="ST.rev.step=${i};render()">${i<step?'✓ ':i===step?'→ ':''}${l}</div>`).join('')}
      </div>
      ${content}
    </div>
  </div>`;
}

let _rfIdx=0;
function triggerRF(i){_rfIdx=i;document.getElementById('rfin').click();}
function loadRF(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{ST.rev.fotos['rev_'+_rfIdx]=e.target.result;save();render();};
  r.readAsDataURL(f);
}
function enviarRev(){
  ST.rev.done=true;
  const {semana,tipo}=ST.u;
  const revSems=tipo==='programa'?[4,8,12]:[3,7,11];
  const nextRev=revSems.find(s=>s>=semana)||revSems[revSems.length-1];
  if(!ST.revHistorial)ST.revHistorial={};
  ST.revHistorial[nextRev]={fotos:{...ST.rev.fotos},medidas:{...ST.rev.medidas},preguntas:{...ST.rev.preguntas},fecha:new Date().toISOString().split('T')[0]};
  if(!Object.keys(ST.medidasIni).length&&Object.keys(ST.rev.medidas).length)ST.medidasIni={...ST.rev.medidas};
  save();render();toast('Revisión S'+nextRev+' enviada ✓','vd');
}
function verRevAnterior(sem){
  const hist=ST.revHistorial&&ST.revHistorial[sem];
  if(!hist){toast('Sin datos guardados para S'+sem,'');return;}
  const POSES=['Frente','Perfil der.','Perfil izq.','Espalda'];
  const MEDS=[['peso','Peso','kg'],['pecho','Pecho','cm'],['cintura','Cintura','cm'],['cadera','Cadera','cm'],['bicepsd','Bíceps der.','cm'],['bicepsi','Bíceps izq.','cm'],['muslod','Muslo der.','cm'],['musloi','Muslo izq.','cm'],['gemelod','Gemelo der.','cm'],['gemeloi','Gemelo izq.','cm']];
  const PP=[...Array(7).keys()].map(i=>hist.preguntas&&hist.preguntas[i]).filter(Boolean);
  let html=`<div style="font-size:12px;color:var(--t3);margin-bottom:14px">${hist.fecha||''}</div>`;
  html+=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px">`;
  POSES.forEach((pos,pi)=>{const f=hist.fotos&&hist.fotos['rev_'+pi];html+=`<div style="aspect-ratio:3/5;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--bor)">${f?`<img src="${f}" style="width:100%;height:100%;object-fit:cover">`:`<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:10px;color:var(--t3);text-align:center;padding:4px">${pos}</div>`}</div>`;});
  html+=`</div>`;
  html+=`<div style="font-weight:700;font-size:13px;margin-bottom:8px">📏 Medidas</div>`;
  MEDS.forEach(([k,l,u])=>{if(hist.medidas&&hist.medidas[k])html+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bor2);font-size:13px"><span style="color:var(--t2)">${l}</span><span style="font-weight:700">${hist.medidas[k]}${u}</span></div>`;});
  if(PP.length){html+=`<div style="font-weight:700;font-size:13px;margin:12px 0 8px">💬 Respuestas</div>`;PP.forEach((a,i)=>html+=`<div style="margin-bottom:8px;font-size:13px;color:var(--t2);padding-left:8px;border-left:3px solid var(--az2)">${a}</div>`);}
  html+=`<div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn btno" style="flex:1" onclick="closeModal()">Cerrar</button>
    <button class="btn btnp" style="flex:1" onclick="closeModal();editarRevAnterior(${sem})">✏️ Editar</button>
  </div>`;
  openModal('Revisión Semana '+sem,html);
}
function editarRevAnterior(sem){
  const hist=ST.revHistorial&&ST.revHistorial[sem];
  if(hist){ST.rev.fotos={...hist.fotos};ST.rev.medidas={...hist.medidas};ST.rev.preguntas={...hist.preguntas};}
  ST.rev.done=false;ST.rev.step=0;
  // Temporarily change semana to edit that revision
  ST._editingSem=sem;
  render();toast('Editando revisión S'+sem,'');
}

// ── PERFIL ──
function logout(){
  _tk=null;
  localStorage.removeItem('ef_tk');
  localStorage.removeItem('ef_role');
  location.reload();
}

function renderPerfil(){
  const u=ST.u;
  const edad=u.dob?Math.floor((new Date()-new Date(u.dob))/31557600000):'—';
  const macro=ST.p.macro;
  const ed=ST.perfilEditing;

  const FAQS=[
    ['¿Con qué frecuencia debo entrenar?',`${DIAS.filter(d=>!d.rest).length} días a la semana según tu plan actual.`],
    ['¿Puedo cambiar ejercicios?','Habla con tu entrenador. El plan está diseñado con progresión específica.'],
    ['¿Qué pasa si me salto un entreno?','No pasa nada. Retoma al día siguiente sin intentar compensar.'],
    ['¿Cuándo veré resultados?','Los primeros cambios en energía y rendimiento: 2-3 semanas. Cambios visuales: 4-6 semanas.'],
    ['¿Puedo comer fuera del menú?','Ocasionalmente sí. Trata de respetar las proporciones de proteína, hidrato y grasa.'],
  ];

  return`
<div class="card">
  <div class="cb" style="text-align:center;padding-top:20px">
    <div class="pav">${u.init}</div>
    <div style="font-size:17px;font-weight:800;margin-bottom:2px">${u.nom}</div>
    <div style="font-size:13px;color:var(--t3)">${u.plan} · Semana ${u.semana}/${u.semTotal}</div>
  </div>
</div>

<div class="card">
  <div class="ch">
    <h2>👤 Mis datos</h2>
    <button class="btn btns ${ed?'btnp':'btno'}" onclick="ST.perfilEditing=!ST.perfilEditing;render()">${ed?'Guardar ✓':'Editar'}</button>
  </div>
  <div class="cb">
    ${[
      ['Fecha de nacimiento','dob','date',u.dob||''],
      ['Edad',null,null,edad+' años'],
      ['Altura',null,null,u.altura+'cm'],
      ['Peso inicial',null,null,u.peso+'kg'],
      ['Objetivo',null,null,u.objetivo+'kg'],
    ].map(([l,k,t,v])=>`<div class="perfil-dato">
      <label>${l}</label>
      ${ed&&k?`<input class="perfil-edit-input" type="${t}" value="${v}" onchange="ST.u['${k}']=this.value;save()">`:`<span class="val">${v}</span>`}
    </div>`).join('')}
    <div class="perfil-dato" style="flex-direction:column;align-items:flex-start;gap:6px">
      <label>Molestias / Lesiones</label>
      ${ed?`<textarea class="preqa" style="margin-bottom:0" onchange="ST.u.lesiones=this.value;save()">${u.lesiones||''}</textarea>`:`<span class="val" style="font-size:13px;color:var(--t2)">${u.lesiones||'Ninguna'}</span>`}
    </div>
  </div>
</div>

<div class="card">
  <div class="ch"><h2>🍽️ Plan nutricional</h2></div>
  <div class="cb">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px">
      <div class="maci"><div class="macv" style="color:var(--nr);font-size:17px">${macro.kcal}</div><div class="macl">kcal/día</div></div>
      <div class="maci"><div class="macv" style="color:var(--az2);font-size:17px">${macro.p}g</div><div class="macl">Proteína</div></div>
      <div class="maci"><div class="macv" style="color:var(--vd);font-size:17px">${macro.c}g</div><div class="macl">Carbos</div></div>
      <div class="maci"><div class="macv" style="color:var(--nr);font-size:17px">${macro.g}g</div><div class="macl">Grasa</div></div>
    </div>
    <button class="btn btno btnf" onclick="generateMenuPDF()">📄 Descargar menú semanal</button>
  </div>
</div>

<div class="trainer-c">
  <div class="trainer-av">A</div>
  <div>
    <div style="font-weight:700;font-size:14px">Álvaro Casal</div>
    <div style="font-size:12px;color:var(--az2)">@alvaro_casal_ · Tu entrenador</div>
    <a href="https://instagram.com/alvaro_casal_" target="_blank" style="font-size:12px;color:var(--az2);text-decoration:none">Escribir en Instagram →</a>
  </div>
</div>

<div class="card">
  <div class="ch"><h2>❓ Preguntas frecuentes</h2></div>
  <div class="cb" style="padding:0">
    ${FAQS.map((f,i)=>`<div class="faq-item">
      <button class="faq-q" onclick="toggleFaq(${i})">${f[0]}<span style="flex-shrink:0">▼</span></button>
      <div class="faq-a" id="faq${i}">${f[1]}</div>
    </div>`).join('')}
  </div>
</div>

<button class="btn btngr btnf" style="margin-top:4px" onclick="logout()">Cerrar sesión</button>`;
}
function toggleFaq(i){const a=document.getElementById('faq'+i);if(a){a.classList.toggle('open');}}
;

// ── INIT ──
window.addEventListener('DOMContentLoaded',()=>{load();});
</script>
</body>
