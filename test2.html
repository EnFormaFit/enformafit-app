<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f4f5f8;height:100vh;display:flex;flex-direction:column}
.topbar{background:#1A2B5A;color:#fff;padding:12px 16px;font-weight:700;flex-shrink:0}
.sticky{position:sticky;top:0;background:#E8F0FE;padding:10px 16px;border-bottom:2px solid #ccc;z-index:10;font-size:13px;font-weight:600}
.sticky2{position:sticky;top:40px;background:#FFF3E0;padding:8px 16px;border-bottom:1px solid #ccc;z-index:9;font-size:12px}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.opt{display:inline-block;padding:10px 16px;background:#fff;border:2px solid #ccc;border-radius:20px;margin:5px;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.opt.on{background:#0DBF6F;border-color:#0DBF6F;color:#fff}
.opt small{display:block;font-size:11px;opacity:.6;pointer-events:none}
#log{background:#fff;border-radius:8px;padding:10px;margin-top:12px;font-size:11px;font-family:monospace;min-height:80px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="topbar">EnFormaFit — Test nutrición</div>
<div class="content" id="ct">
  <div class="sticky">📋 Tabs (sticky top:0 z-index:10)</div>
  <div class="sticky2">📅 Días (sticky top:40 z-index:9)</div>
  <br>
  <div style="font-weight:700;margin-bottom:8px">🌅 Desayuno</div>
  <div id="opts"></div>
  <div id="log">Toca los botones de alimentos...\n</div>
</div>
<script>
const items = ['Pechuga de pollo 250g','Merluza 300g','Whey Protein 30g','Huevo entero 3ud','Salmón 200g','Atún natural 150g'];
let selected = null;
const _NIT = items.map((nom,i) => ({nom, idx:i}));

function log(m){const el=document.getElementById('log');el.textContent+=new Date().toISOString().slice(11,22)+' '+m+'\n';el.scrollTop=9999;}

function selItem(idx) {
  log('selItem called: idx='+idx+' nom='+_NIT[idx].nom);
  selected = idx;
  renderOpts();
}

function renderOpts() {
  const d = document.getElementById('opts');
  d.innerHTML = _NIT.map((it,i) => 
    `<button class="opt ${selected===i?'on':''}" onclick="log('onclick idx='+${i});selItem(${i})">
      ${it.nom}<small>gramos info</small>
    </button>`
  ).join('');
  log('renderOpts done, '+_NIT.length+' buttons created');
}

renderOpts();
</script>
</body>
</html>
