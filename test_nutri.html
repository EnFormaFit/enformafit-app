<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f4f5f8;height:100vh;display:flex;flex-direction:column}
.topbar{background:#1A2B5A;color:#fff;padding:12px 16px;font-weight:700;flex-shrink:0;font-size:16px}
.sticky-tabs{position:sticky;top:0;z-index:10;background:#f4f5f8;padding:0 13px;border-bottom:2px solid #E2E6EF}
.tabs{display:flex}.tab{padding:9px 14px;font-size:13px;font-weight:700;color:#1A2B5A;border:none;background:none;font-family:inherit}
.nut-day-sticky{position:sticky;top:40px;z-index:9;background:#f4f5f8;padding:7px 13px 5px;border-bottom:1px solid #E2E6EF}
.nut-days{display:flex;gap:6px}.nd{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1.5px solid #E2E6EF;background:#fff;font-size:12.5px;font-weight:600;color:#5A6480;cursor:pointer;font-family:inherit}
.nd.on{background:#1A2B5A;border-color:#1A2B5A;color:#fff}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:13px}
.cat-lbl{font-size:11px;font-weight:700;color:#5A6480;margin-bottom:5px;text-transform:uppercase;margin-top:12px}
.opts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.opt{padding:8px 12px;border-radius:20px;border:1.5px solid #E2E6EF;background:#fff;font-size:13px;font-weight:500;color:#5A6480;cursor:pointer;font-family:inherit;touch-action:manipulation;-webkit-user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.opt.on{border-color:#0DBF6F;background:#D4F7E8;color:#07854D;font-weight:600}
#log{background:#fff;border-radius:8px;padding:10px;margin-top:16px;font-size:11px;font-family:monospace;min-height:80px;white-space:pre-wrap;border:1px solid #E2E6EF}
</style>
</head>
<body>
<div class="topbar">Test Nutricion Movil</div>
<div class="content" id="ct">
<div class="sticky-tabs"><div class="tabs"><button class="tab">Mi menu</button></div></div>
<div class="nut-day-sticky"><div class="nut-days"><button class="nd on">Lun</button><button class="nd">Mar</button><button class="nd">Mie</button></div></div>
<div id="mc"></div>
<div id="log">Toca los alimentos...\n</div>
</div>
<script>
var _NIT=[];
var sel={};
function log(m){var el=document.getElementById('log');el.textContent+=new Date().toISOString().slice(11,22)+' '+m+'\n';}
function nitP(di,meal,tipo,idx){log('nitP idx='+idx+' NIT.len='+_NIT.length);var it=_NIT[idx];if(!it){log('ERROR: item not found');return;}sel.prot=it.nom;log('OK: '+it.nom);render();}
function nitI(di,meal,cat,idx){log('nitI cat='+cat+' idx='+idx);var it=_NIT[idx];if(!it){log('ERROR: item not found');return;}sel[cat]=it.nom;log('OK: '+it.nom);render();}
function render(){
_NIT=[];
var P=['Pechuga pollo','Merluza','Whey Protein','Huevo entero','Salmon','Atun'];
var H=['Arroz 80g','Pasta 80g','Patata 200g','Boniato 150g'];
var out='<div style="font-weight:800;font-size:15px;margin-top:12px">Desayuno</div>';
out+='<div class="cat-lbl">Proteina</div><div class="opts">';
for(var i=0;i<P.length;i++){var idx=_NIT.length;_NIT.push({nom:P[i]});var on=sel.prot===P[i];out+='<button class="opt '+(on?'on':'')+'" onclick="nitP(0,\'desayuno\',\'magra\','+idx+')">'+P[i]+'</button>';}
out+='</div>';
out+='<div class="cat-lbl">Hidrato</div><div class="opts">';
for(var j=0;j<H.length;j++){var idx2=_NIT.length;_NIT.push({nom:H[j]});var on2=sel.hidrat===H[j];out+='<button class="opt '+(on2?'on':'')+'" onclick="nitI(0,\'desayuno\',\'hidrat\','+idx2+')">'+H[j]+'</button>';}
out+='</div>';
out+='<div style="font-size:13px;color:#666;margin-top:8px">Prot: <b>'+(sel.prot||'-')+'</b> Hidrat: <b>'+(sel.hidrat||'-')+'</b></div>';
document.getElementById('mc').innerHTML=out;
log('render done NIT='+_NIT.length);
}
render();
</script>
</body>
</html>
